// ── FIREBASE ──────────────────────────────────────────────────────────────────
async function cargarDatos(){
  try {
    const [pSnap,iSnap] = await Promise.all([
      getDoc(doc(db,'config','productos')),
      getDoc(doc(db,'config','insumos'))
    ]);
    const productos = pSnap.exists()?pSnap.data().lista:DEFAULT_PRODUCTOS;
    const insumos   = iSnap.exists()?iSnap.data().lista:DEFAULT_INSUMOS;
    if(!pSnap.exists()) await setDoc(doc(db,'config','productos'),{lista:DEFAULT_PRODUCTOS});
    if(!iSnap.exists()) await setDoc(doc(db,'config','insumos'),{lista:DEFAULT_INSUMOS});

    // Día actual
    const diaSnap = await getDoc(doc(db,'dias',hoy()));
    let pedidos = [], tituloDia = '', esDiaNuevo = false, diaCerrado = false;

    if(diaSnap.exists()){
      const data = diaSnap.data();
      pedidos = data.pedidos||[];
      tituloDia = data.titulo||'';
      diaCerrado = data.abierto === false; // día ya cerrado
    } else {
      esDiaNuevo = true; // día nuevo, pedir título
    }

    // Historial — todos los días excepto hoy, ordenados por fecha desc
    const histSnap = await getDocs(collection(db,'dias'));
    const historial = histSnap.docs
      .map(d=>({fecha:d.id,...d.data()}))
      .filter(d=>d.fecha!==hoy())
      .sort((a,b)=>b.fecha.localeCompare(a.fecha));

    Object.assign(S,{productos,insumos,pedidos,tituloDia,historial,loading:false,modalTituloDia:esDiaNuevo,diaCerrado});
    render();
  } catch(e){
    toast('Error al cargar: '+e.message,'error');
    S.loading=false; render();
  }
}

async function guardarProductos(lista){ await setDoc(doc(db,'config','productos'),{lista}); }
async function guardarInsumos(lista){ await setDoc(doc(db,'config','insumos'),{lista}); }

async function guardarPedidosDia(pedidos){
  const ref = doc(db,'dias',hoy());
  const snap = await getDoc(ref);
  if(snap.exists()){
    await updateDoc(ref,{pedidos});
  } else {
    await setDoc(ref,{pedidos,fecha:hoy(),titulo:S.tituloDia||fechaLegible(hoy()),abierto:true});
  }
}

async function confirmarTituloDia(){
  const titulo = S.inputTituloDia.trim()||fechaLegible(hoy());
  await setDoc(doc(db,'dias',hoy()),{pedidos:[],fecha:hoy(),titulo,abierto:true});
  set({tituloDia:titulo,modalTituloDia:false,inputTituloDia:'',pedidos:[],diaCerrado:false});
  toast('✅ Jornada iniciada: '+titulo);
}

async function cerrarDia(){
  const cobrados = S.pedidos.filter(p=>p.estado==='cobrado');
  const total = cobrados.reduce((s,p)=>s+p.total,0);
  const efectivo = cobrados.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const digital = cobrados.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  try {
    const ref = doc(db,'dias',hoy());
    const snap = await getDoc(ref);
    const dataGuardar = {
      pedidos: S.pedidos,
      fecha: hoy(),
      titulo: S.tituloDia||fechaLegible(hoy()),
      abierto: false,
      cerradoEn: new Date().toISOString(),
      resumen: {total,efectivo,digital,cantPedidos:cobrados.length}
    };
    if(snap.exists()) await updateDoc(ref,{...dataGuardar});
    else await setDoc(ref,dataGuardar);

    // Recargar historial
    const histSnap = await getDocs(collection(db,'dias'));
    const historial = histSnap.docs
      .map(d=>({fecha:d.id,...d.data()}))
      .filter(d=>d.fecha!==hoy())
      .sort((a,b)=>b.fecha.localeCompare(a.fecha));

    // Marcar día como cerrado en el estado — NO borrar pedidos de pantalla
    set({historial, diaCerrado:true});
    toast('✅ Jornada cerrada y guardada en historial');
  } catch(e){ toast('Error al cerrar: '+e.message,'error'); }
}

async function eliminarDia(fecha){
  try {
    await deleteDoc(doc(db,'dias',fecha));
    const historial = S.historial.filter(d=>d.fecha!==fecha);
    set({historial,diaSeleccionado:null});
    toast('Jornada eliminada','warn');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function toast(msg,tipo='ok'){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  const t=setTimeout(()=>set({toast:null,toastTimer:null}),3500);
  set({toast:{msg,tipo},toastTimer:t});
}

// ── PEDIDOS ───────────────────────────────────────────────────────────────────
async function crearPedido(){
  if(!S.nuevoNombre.trim()){toast('Ingresá nombre o número','warn');return;}
  if(S.diaCerrado){toast('La jornada está cerrada. Iniciá una nueva.','error');return;}
  const p={id:genId(),tipo:S.nuevoTipo,nombre:S.nuevoNombre.trim(),items:[],estado:'abierto',creadoEn:horaActual(),total:0,pago:null};
  const pedidos=[p,...S.pedidos];
  set({pedidos,modalNuevoPedido:false,pedidoActivo:p.id,nuevoNombre:''});
  await guardarPedidosDia(pedidos);
}
async function agregarItem(pedidoId,prod){
  const pedidos=S.pedidos.map(p=>{
    if(p.id!==pedidoId)return p;
    const ex=p.items.find(i=>i.productoId===prod.id);
    const items=ex?p.items.map(i=>i.productoId===prod.id?{...i,cantidad:i.cantidad+1}:i):[...p.items,{productoId:prod.id,nombre:prod.nombre,precio:prod.precio,emoji:prod.emoji,cantidad:1}];
    return{...p,items,total:items.reduce((s,i)=>s+i.precio*i.cantidad,0)};
  });
  set({pedidos}); await guardarPedidosDia(pedidos);
}
async function quitarItem(pedidoId,productoId){
  const pedidos=S.pedidos.map(p=>{
    if(p.id!==pedidoId)return p;
    const items=p.items.map(i=>i.productoId===productoId?{...i,cantidad:i.cantidad-1}:i).filter(i=>i.cantidad>0);
    return{...p,items,total:items.reduce((s,i)=>s+i.precio*i.cantidad,0)};
  });
  set({pedidos}); await guardarPedidosDia(pedidos);
}
async function cobrarPedido(pedidoId,metodoPago){
  let ins=[...S.insumos];
  const pedidos=S.pedidos.map(p=>{
    if(p.id!==pedidoId)return p;
    p.items.forEach(item=>{
      const prod=S.productos.find(pr=>pr.id===item.productoId);
      if(!prod)return;
      prod.insumos.forEach(req=>{
        const idx=ins.findIndex(i=>i.id===req.insumoId);
        if(idx>=0)ins[idx]={...ins[idx],stock:Math.max(0,ins[idx].stock-req.cantidad*item.cantidad)};
      });
    });
    return{...p,estado:'cobrado',pago:metodoPago,cerradoEn:horaActual()};
  });
  set({pedidos,insumos:ins,modalCobro:null,pedidoActivo:S.pedidoActivo===pedidoId?null:S.pedidoActivo});
  await Promise.all([guardarPedidosDia(pedidos),guardarInsumos(ins)]);
  toast('✅ Pedido cobrado');
}
async function eliminarPedido(pedidoId){
  const pedidos=S.pedidos.filter(p=>p.id!==pedidoId);
  set({pedidos,pedidoActivo:S.pedidoActivo===pedidoId?null:S.pedidoActivo});
  await guardarPedidosDia(pedidos); toast('Pedido eliminado','warn');
}
async function cancelarPedido(pedidoId){
  const pedidos=S.pedidos.map(p=>p.id===pedidoId?{...p,estado:'cancelado'}:p);
  set({pedidos,pedidoActivo:S.pedidoActivo===pedidoId?null:S.pedidoActivo});
  await guardarPedidosDia(pedidos); toast('Pedido cancelado','warn');
}

// ── PRODUCTOS / INSUMOS ───────────────────────────────────────────────────────
async function guardarProducto(){
  const f=S.formProducto;
  if(!f.nombre.trim()||!f.precio){toast('Completá nombre y precio','warn');return;}
  let lista;
  if(S.editandoProducto){lista=S.productos.map(p=>p.id===S.editandoProducto?{...p,...f,precio:Number(f.precio)}:p);toast('Actualizado');}
  else{lista=[...S.productos,{id:genId(),...f,precio:Number(f.precio)}];toast('Agregado ✓');}
  set({productos:lista,modalProducto:false}); await guardarProductos(lista);
}
async function eliminarProducto(id){
  const lista=S.productos.filter(p=>p.id!==id);
  set({productos:lista}); await guardarProductos(lista); toast('Eliminado','warn');
}
async function guardarInsumo(){
  const f=S.formInsumo;
  if(!f.nombre.trim()){toast('Ingresá un nombre','warn');return;}
  let lista;
  if(S.editandoInsumo){lista=S.insumos.map(i=>i.id===S.editandoInsumo?{...i,...f,stock:Number(f.stock)}:i);toast('Actualizado');}
  else{lista=[...S.insumos,{id:genId(),...f,stock:Number(f.stock)}];toast('Agregado ✓');}
  set({insumos:lista,modalInsumo:false}); await guardarInsumos(lista);
}
async function cargarStockInsumo(){
  const cant=Number(S.cantCarga);
  if(!cant||isNaN(cant)){toast('Cantidad inválida','warn');return;}
  const lista=S.insumos.map(i=>i.id===S.modalCargaInsumo?{...i,stock:i.stock+cant}:i);
  set({insumos:lista,modalCargaInsumo:null,cantCarga:''}); await guardarInsumos(lista); toast('Stock actualizado ✓');
}
async function eliminarInsumo(id){
  if(S.productos.some(p=>p.insumos.some(i=>i.insumoId===id))){toast('Insumo en uso','error');return;}
  const lista=S.insumos.filter(i=>i.id!==id);
  set({insumos:lista}); await guardarInsumos(lista); toast('Eliminado','warn');
}

// ── DOM ───────────────────────────────────────────────────────────────────────
const root=document.getElementById('root');
function el(tag,props={},children=[]){
  const e=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
const is=s=>({width:'100%',background:'#0f0f13',border:'1px solid #333',borderRadius:'10px',padding:'10px 12px',color:'#f0ece4',fontSize:'14px',outline:'none',...s});
const CC={comida:'#f5a623',bebida:'#38bdf8',promo:'#a78bfa'};
const TC={mesa:'#38bdf8',delivery:'#f97316'};

function makeModal(title,onClose,content){
  const ov=el('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.78)',zIndex:'500',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'},onClick:e=>{if(e.target===ov&&onClose)onClose();}});
  const box=el('div',{style:{background:'#1c1c27',borderRadius:'16px',padding:'24px',width:'100%',maxWidth:'480px',maxHeight:'90vh',overflowY:'auto',border:'1px solid #2e2e3e'}});
  const hdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}});
  hdr.appendChild(el('h3',{style:{margin:'0',fontWeight:'800',color:'#f5a623'}},[title]));
  if(onClose)hdr.appendChild(el('button',{style:{background:'none',border:'none',color:'#888',fontSize:'22px',cursor:'pointer'},onClick:onClose},['✕']));
  box.appendChild(hdr); box.appendChild(content); ov.appendChild(box); return ov;
}
function confirmDialog(titulo,msg,onOk){ set({modalConfirm:{titulo,msg,onOk}}); }

    el('span',{style:{fontSize:'24px'}},['🍺🍗']),

  root.appendChild(el('nav',{style:{position:'fixed',bottom:'0',left:'0',right:'0',background:'#1a1a22',borderTop:'1px solid #2a2a35',display:'flex',zIndex:'100'}},

}

// ── RENDER PEDIDOS ────────────────────────────────────────────────────────────
function renderPedidos(){
  const div=el('div',{style:{padding:'16px'}});

  const topRow=el('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});

    topRow.appendChild(el('div',{style:{flex:'1',background:'#1c1c27',borderRadius:'10px',padding:'10px 14px',fontSize:'13px',color:'#888',border:'1px solid #2a2a35'}},['🔒 Jornada cerrada — no se pueden crear pedidos']));

    else{

        r.appendChild(el('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[item.nombre]));
        const ctrl=el('div',{style:{display:'flex',alignItems:'center',gap:'6px'}});
        ctrl.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900'},onClick:()=>quitarItem(ped.id,item.productoId)},['−']));
        ctrl.appendChild(el('span',{style:{fontWeight:'800',minWidth:'20px',textAlign:'center'}},[String(item.cantidad)]));
        ctrl.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900'},onClick:()=>agregarItem(ped.id,S.productos.find(p=>p.id===item.productoId))},['+'  ]));
        r.appendChild(ctrl);
        r.appendChild(el('span',{style:{fontWeight:'800',color:'#f5a623',minWidth:'70px',textAlign:'right',fontSize:'13px'}},[fmt(item.precio*item.cantidad)]));
        iD.appendChild(r);
      });

    const tR=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}});
    tR.appendChild(el('span',{style:{fontWeight:'700',color:'#888',fontSize:'13px'}},['TOTAL']));
    tR.appendChild(el('span',{style:{fontWeight:'900',fontSize:'24px',color:'#4ade80'}},[fmt(ped.total)]));

    card.appendChild(el('p',{style:{fontSize:'11px',color:'#555',margin:'0 0 10px',fontWeight:'800',letterSpacing:'1px'}},['AGREGAR AL PEDIDO']));

      const prods=S.productos.filter(p=>p.categoria===cat);

          el('span',{style:{fontSize:'20px'}},[prod.emoji]),
          el('div',{},[el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#f0ece4',lineHeight:'1.3'}},[prod.nombre]),el('div',{style:{fontSize:'12px',color:CC[cat],fontWeight:'800'}},[fmt(prod.precio)])]),
        ]));
      });
      card.appendChild(grid);
    });
    div.appendChild(card);
  }

  const filtrados=S.pedidos.filter(p=>S.filtroP==='abiertos'?p.estado==='abierto':S.filtroP==='cobrados'?p.estado==='cobrado':p.estado==='cancelado');
  if(!filtrados.length){div.appendChild(el('div',{style:{textAlign:'center',color:'#333',padding:'40px 0',fontSize:'14px'}},['No hay pedidos '+S.filtroP]));}
  else{

      const c=el('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',border:S.pedidoActivo===p.id?'2px solid #f5a623':'1px solid #2a2a35',opacity:p.estado==='cancelado'?'0.4':'1'}});
      const r=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      const l=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',flex:'1',cursor:p.estado==='abierto'&&!S.diaCerrado?'pointer':'default'},onClick:()=>p.estado==='abierto'&&!S.diaCerrado&&set({pedidoActivo:p.id})});
      l.appendChild(el('span',{style:{fontWeight:'900',fontSize:'14px'}},[p.nombre]));
      l.appendChild(el('span',{},[p.tipo==='delivery'?'🛵':'🪑']));
      if(p.estado==='cobrado')l.appendChild(el('span',{style:{background:'#22c55e22',color:'#22c55e',borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700',border:'1px solid #22c55e44'}},['✅ '+p.pago]));
      if(p.estado==='cancelado')l.appendChild(el('span',{style:{background:'#ef444422',color:'#ef4444',borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700'}},['cancelado']));
      r.appendChild(l);

      rR.appendChild(el('span',{style:{fontWeight:'900',color:'#f5a623',fontSize:'15px'}},[fmt(p.total)]));
      rR.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'6px',padding:'4px 8px',fontSize:'12px',cursor:'pointer'},onClick:e=>{e.stopPropagation();confirmDialog('Eliminar pedido','¿Eliminar el pedido de '+p.nombre+'?',()=>eliminarPedido(p.id));}},['🗑️']));
      r.appendChild(rR); c.appendChild(r);
      c.appendChild(el('div',{style:{fontSize:'11px',color:'#444',marginTop:'3px'}},[`${p.items.length} productos · ${p.creadoEn}${p.cerradoEn?' → '+p.cerradoEn:''}`]));
      lista.appendChild(c);
    });
    div.appendChild(lista);
  }
  return div;
}

// ── RENDER CAJA ───────────────────────────────────────────────────────────────
function renderCaja(){
  const cobrados=S.pedidos.filter(p=>p.estado==='cobrado');
  const total=cobrados.reduce((s,p)=>s+p.total,0);
  const efectivo=cobrados.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const digital=cobrados.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  const ventasProd={};
  cobrados.forEach(p=>p.items.forEach(it=>{
    if(!ventasProd[it.nombre])ventasProd[it.nombre]={cantidad:0,total:0,emoji:it.emoji};
    ventasProd[it.nombre].cantidad+=it.cantidad; ventasProd[it.nombre].total+=it.precio*it.cantidad;
  }));
  const ranking=Object.entries(ventasProd).sort(([,a],[,b])=>b.cantidad-a.cantidad);
  const div=el('div',{style:{padding:'16px'}});

  const tj=el('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',marginBottom:'12px',border:'1px solid #2a2a35',display:'flex',justifyContent:'space-between',alignItems:'center'}});
  tj.appendChild(el('div',{},[el('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},['JORNADA']),el('div',{style:{fontWeight:'900',fontSize:'15px',color:S.diaCerrado?'#ef4444':'#f5a623'}},[S.tituloDia||fechaLegible(hoy())])]));
  if(!S.diaCerrado)tj.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#888',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},onClick:()=>set({modalTituloDia:true,inputTituloDia:S.tituloDia})},['✏️']));
  div.appendChild(tj);

  const tc=el('div',{style:{background:'linear-gradient(135deg,#22c55e22,#22c55e0a)',border:'1px solid #22c55e44',borderRadius:'14px',padding:'16px',marginBottom:'10px'}});
  tc.appendChild(el('div',{style:{fontSize:'12px',color:'#22c55e',fontWeight:'700',marginBottom:'4px'}},['💰 TOTAL DEL DÍA']));
  tc.appendChild(el('div',{style:{fontSize:'34px',fontWeight:'900',color:'#22c55e'}},[fmt(total)]));
  tc.appendChild(el('div',{style:{fontSize:'12px',color:'#888',marginTop:'4px'}},[cobrados.length+' pedidos cobrados']));
  div.appendChild(tc);

  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'16px'}});
  [[fmt(efectivo),'💵 EFECTIVO','#f5a623',cobrados.filter(p=>p.pago==='efectivo').length+' pedidos'],
   [fmt(digital),'📱 DIGITAL','#38bdf8',cobrados.filter(p=>p.pago==='digital').length+' pedidos'],
   [String(cobrados.filter(p=>p.tipo==='mesa').length),'🪑 MESAS','#a78bfa',''],
   [String(cobrados.filter(p=>p.tipo==='delivery').length),'🛵 DELIVERY','#f97316',''],
  ].forEach(([v,l,c,s])=>{
    const card=el('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'14px'}});
    card.appendChild(el('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},[l]));
    card.appendChild(el('div',{style:{fontSize:'22px',fontWeight:'900',color:c,marginTop:'4px'}},[v]));
    if(s)card.appendChild(el('div',{style:{fontSize:'11px',color:'#666'}},[s]));
    grid.appendChild(card);
  });
  div.appendChild(grid);

  const rank=el('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'14px'}});
  rank.appendChild(el('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'12px'}},['📊 PRODUCTOS MÁS VENDIDOS']));
  if(!ranking.length)rank.appendChild(el('p',{style:{color:'#444',textAlign:'center',fontSize:'13px'}},['Sin ventas aún']));
  else ranking.forEach(([nombre,data],idx)=>{
    const r=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:idx<ranking.length-1?'1px solid #2a2a35':'none'}});
    r.appendChild(el('span',{style:{fontSize:'10px',color:'#555',fontWeight:'900',minWidth:'16px'}},['#'+(idx+1)]));
    r.appendChild(el('span',{style:{fontSize:'18px'}},[data.emoji]));
    r.appendChild(el('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[nombre]));
    r.appendChild(el('span',{style:{fontSize:'12px',color:'#888'}},[data.cantidad+' u.']));
    r.appendChild(el('span',{style:{fontWeight:'800',color:'#f5a623',fontSize:'13px'}},[fmt(data.total)]));
    rank.appendChild(r);
  });
  div.appendChild(rank);

  if(!S.diaCerrado){
    const abiertos=S.pedidos.filter(p=>p.estado==='abierto').length;
    div.appendChild(el('button',{
      style:{width:'100%',background:abiertos>0?'#2a2a35':'#f5a623',color:abiertos>0?'#555':'#0f0f13',border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:abiertos>0?'not-allowed':'pointer'},
      onClick:()=>abiertos===0&&confirmDialog('Cerrar jornada','¿Cerrar la jornada "'+(S.tituloDia||fechaLegible(hoy()))+'"? Se guardará en el historial y se reiniciará al día siguiente.',cerrarDia)
    },[abiertos>0?`⚠️ Hay ${abiertos} pedido(s) abierto(s)`:'📅 Cerrar la jornada y guardar']));
  } else {
    div.appendChild(el('button',{
      style:{width:'100%',background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:'pointer'},
      onClick:()=>set({modalTituloDia:true,inputTituloDia:''})
    },['🌅 Iniciar nueva jornada']));
  }
  return div;
}

// ── RENDER HISTORIAL ──────────────────────────────────────────────────────────
function renderHistorial(){
  const div=el('div',{style:{padding:'16px'}});
  div.appendChild(el('h3',{style:{marginBottom:'16px',color:'#f5a623',fontWeight:'900'}},['📅 Historial de Jornadas']));
  if(!S.historial.length){div.appendChild(el('div',{style:{textAlign:'center',color:'#444',padding:'40px 0',fontSize:'14px'}},['Todavía no hay jornadas cerradas']));return div;}
  S.historial.forEach(dia=>{
    const res=dia.resumen||{};
    const card=el('div',{style:{background:'#1c1c27',borderRadius:'14px',padding:'16px',marginBottom:'10px',border:'1px solid #2a2a35'}});
    const top=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'},onClick:()=>set({diaSeleccionado:S.diaSeleccionado===dia.fecha?null:dia.fecha})});
    const left=el('div');
    left.appendChild(el('div',{style:{fontWeight:'900',fontSize:'15px'}},[dia.titulo||fechaLegible(dia.fecha)]));
    left.appendChild(el('div',{style:{fontSize:'11px',color:'#666',marginTop:'2px'}},[fechaLegible(dia.fecha)+' · '+(res.cantPedidos||0)+' pedidos']));
    top.appendChild(left);
    const right=el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
    const info=el('div',{style:{textAlign:'right'}});
    info.appendChild(el('div',{style:{fontWeight:'900',color:'#4ade80',fontSize:'18px'}},[fmt(res.total||0)]));
    info.appendChild(el('span',{style:{fontSize:'10px',color:dia.abierto?'#f59e0b':'#22c55e',fontWeight:'700'}},[dia.abierto===false?'✅ CERRADO':'⚠️ SIN CERRAR']));
    right.appendChild(info);
    right.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'13px'},onClick:e=>{e.stopPropagation();confirmDialog('Eliminar jornada','¿Eliminar "'+(dia.titulo||fechaLegible(dia.fecha))+'"?',()=>eliminarDia(dia.fecha));}},['🗑️']));
    top.appendChild(right); card.appendChild(top);
    if(S.diaSeleccionado===dia.fecha){
      const det=el('div',{style:{marginTop:'14px',borderTop:'1px solid #2a2a35',paddingTop:'14px'}});
      const g=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'12px'}});
      [[fmt(res.efectivo||0),'💵 Efectivo','#f5a623'],[fmt(res.digital||0),'📱 Digital','#38bdf8']].forEach(([v,l,c])=>{
        const cc=el('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'10px'}});
        cc.appendChild(el('div',{style:{fontSize:'11px',color:'#888'}},[l]));
        cc.appendChild(el('div',{style:{fontSize:'18px',fontWeight:'900',color:c}},[v]));
        g.appendChild(cc);
      });
      det.appendChild(g);
      if(dia.pedidos&&dia.pedidos.filter(p=>p.estado==='cobrado').length){
        det.appendChild(el('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700',marginBottom:'8px'}},['PEDIDOS COBRADOS']));
        dia.pedidos.filter(p=>p.estado==='cobrado').forEach(p=>{
          const pr=el('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1a1a22',fontSize:'13px'}});
          pr.appendChild(el('span',{},[p.nombre+' '+(p.tipo==='delivery'?'🛵':'🪑')]));
          pr.appendChild(el('span',{style:{color:'#f5a623',fontWeight:'800'}},[fmt(p.total)]));
          det.appendChild(pr);
        });
      }
      card.appendChild(det);
    }
    div.appendChild(card);
  });
  return div;
}

// ── MODALES ───────────────────────────────────────────────────────────────────
function renderModalTituloDia(){
  const esDiaNuevo=!S.tituloDia||S.diaCerrado;
  const cont=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
  cont.appendChild(el('p',{style:{color:'#888',fontSize:'13px'}},[esDiaNuevo?'Poné un nombre para identificar la nueva jornada en el historial.':'Cambiá el nombre de la jornada.']));
  const i=el('input',{style:is(),placeholder:'Ej: Viernes noche, Sábado 24...',value:S.inputTituloDia});
  i.addEventListener('input',e=>S.inputTituloDia=e.target.value);
  i.addEventListener('keydown',e=>e.key==='Enter'&&confirmarTituloDia());
  cont.appendChild(i);
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:confirmarTituloDia},['✅ '+(esDiaNuevo?'Iniciar nueva jornada':'Confirmar')]));
  if(!esDiaNuevo)cont.appendChild(el('button',{style:{background:'transparent',color:'#888',border:'1px solid #333',borderRadius:'10px',padding:'12px',fontWeight:'700',fontSize:'13px',cursor:'pointer'},onClick:()=>set({modalTituloDia:false})},['Cancelar']));
  setTimeout(()=>i.focus(),50);
  return makeModal(esDiaNuevo?'🌅 Nueva jornada':'✏️ Editar jornada',esDiaNuevo?null:()=>set({modalTituloDia:false}),cont);
}
function renderModalNuevoPedido(){
  const cont=el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  const tb=el('div',{style:{display:'flex',gap:'8px'}});
  ['mesa','delivery'].forEach(t=>tb.appendChild(el('button',{style:{flex:'1',padding:'12px',borderRadius:'10px',border:'none',background:S.nuevoTipo===t?TC[t]:'#2a2a35',color:S.nuevoTipo===t?'#0f0f13':'#888',fontWeight:'800',cursor:'pointer',fontSize:'14px'},onClick:()=>set({nuevoTipo:t})},[t==='mesa'?'🪑 Mesa':'🛵 Delivery'])));
  cont.appendChild(tb);
  const i=el('input',{style:is(),placeholder:S.nuevoTipo==='mesa'?'N° de mesa o nombre...':'Nombre del cliente...',value:S.nuevoNombre});
  i.addEventListener('input',e=>S.nuevoNombre=e.target.value);
  i.addEventListener('keydown',e=>e.key==='Enter'&&crearPedido());
  cont.appendChild(i);
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:crearPedido},['Crear Pedido']));
  setTimeout(()=>i.focus(),50);
  return makeModal('Nuevo Pedido',()=>set({modalNuevoPedido:false}),cont);
}
function renderModalCobro(){
  const p=S.pedidos.find(x=>x.id===S.modalCobro);
  const cont=el('div');
  cont.appendChild(el('div',{style:{textAlign:'center',marginBottom:'20px'}},[el('div',{style:{fontSize:'14px',color:'#888',marginBottom:'4px'}},[p?.nombre||'']),el('div',{style:{fontSize:'36px',fontWeight:'900',color:'#4ade80'}},[fmt(p?.total)])]));
  cont.appendChild(el('p',{style:{color:'#888',textAlign:'center',marginBottom:'16px',fontSize:'13px'}},['¿Cómo paga?']));
  const btns=el('div',{style:{display:'flex',gap:'10px'}});
  btns.appendChild(el('button',{style:{flex:'1',background:'#22c55e',color:'#fff',border:'none',borderRadius:'12px',padding:'18px',fontWeight:'900',fontSize:'17px',cursor:'pointer'},onClick:()=>cobrarPedido(S.modalCobro,'efectivo')},['💵 Efectivo']));
  btns.appendChild(el('button',{style:{flex:'1',background:'#38bdf8',color:'#0f0f13',border:'none',borderRadius:'12px',padding:'18px',fontWeight:'900',fontSize:'17px',cursor:'pointer'},onClick:()=>cobrarPedido(S.modalCobro,'digital')},['📱 Digital']));
  cont.appendChild(btns);
  return makeModal('Cobrar Pedido',()=>set({modalCobro:null}),cont);
}
function renderModalProducto(){
  const cont=el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  const r1=el('div',{style:{display:'flex',gap:'8px'}});
  const ei=el('input',{style:is({width:'56px',fontSize:'22px',textAlign:'center'}),value:S.formProducto.emoji});
  ei.addEventListener('input',e=>S.formProducto.emoji=e.target.value);
  const ni=el('input',{style:is({flex:'1'}),placeholder:'Nombre del producto',value:S.formProducto.nombre});
  ni.addEventListener('input',e=>S.formProducto.nombre=e.target.value);
  r1.appendChild(ei);r1.appendChild(ni);cont.appendChild(r1);
  const pi=el('input',{type:'number',style:is(),placeholder:'Precio de venta ($)',value:S.formProducto.precio});
  pi.addEventListener('input',e=>S.formProducto.precio=e.target.value);
  cont.appendChild(pi);
  const cb=el('div',{style:{display:'flex',gap:'6px'}});
  ['comida','bebida','promo'].forEach(c=>cb.appendChild(el('button',{style:{flex:'1',padding:'8px 0',borderRadius:'8px',border:'none',background:S.formProducto.categoria===c?(CC[c]||'#f5a623'):'#2a2a35',color:S.formProducto.categoria===c?'#0f0f13':'#888',fontWeight:'700',cursor:'pointer',fontSize:'12px'},onClick:()=>{S.formProducto.categoria=c;render();}},[c])));
  cont.appendChild(cb);
  cont.appendChild(el('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700'}},['INSUMOS QUE USA']));
  S.formProducto.insumos.forEach((ins,idx)=>{
    const ir=el('div',{style:{display:'flex',gap:'6px',marginBottom:'6px'}});
    const sel=el('select',{style:{flex:'2',background:'#0f0f13',border:'1px solid #333',borderRadius:'8px',padding:'8px 6px',color:'#f0ece4',fontSize:'12px'}});
    sel.appendChild(el('option',{value:''},['-- Insumo --']));
    S.insumos.forEach(i=>{const o=el('option',{value:i.id},[i.nombre+' ('+i.unidad+')']);if(i.id===ins.insumoId)o.selected=true;sel.appendChild(o);});
    sel.addEventListener('change',e=>S.formProducto.insumos[idx].insumoId=e.target.value);
    const ci=el('input',{type:'number',style:is({flex:'1'}),placeholder:'Cant.',value:ins.cantidad||''});
    ci.addEventListener('input',e=>S.formProducto.insumos[idx].cantidad=Number(e.target.value));
    ir.appendChild(sel);ir.appendChild(ci);
    ir.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'0 10px',cursor:'pointer'},onClick:()=>{S.formProducto.insumos.splice(idx,1);render();}},['✕']));
    cont.appendChild(ir);
  });
  cont.appendChild(el('button',{style:{background:'#2a2a35',border:'1px dashed #444',borderRadius:'8px',color:'#888',padding:'8px 0',width:'100%',cursor:'pointer',fontSize:'12px'},onClick:()=>{S.formProducto.insumos.push({insumoId:'',cantidad:0});render();}},['+ Agregar insumo']));
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:guardarProducto},[S.editandoProducto?'Guardar cambios':'Agregar producto']));
  return makeModal(S.editandoProducto?'Editar Producto':'Nuevo Producto',()=>set({modalProducto:false}),cont);
}
function renderModalInsumo(){
  const cont=el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  const ni=el('input',{style:is(),placeholder:'Nombre del insumo',value:S.formInsumo.nombre});
  ni.addEventListener('input',e=>S.formInsumo.nombre=e.target.value);
  cont.appendChild(ni);
  const r=el('div',{style:{display:'flex',gap:'8px'}});
  const si=el('input',{type:'number',style:is({flex:'1'}),placeholder:'Stock inicial',value:S.formInsumo.stock});
  si.addEventListener('input',e=>S.formInsumo.stock=e.target.value);
  const sel=el('select',{style:{width:'80px',background:'#0f0f13',border:'1px solid #333',borderRadius:'10px',padding:'10px',color:'#f0ece4',fontSize:'14px'}});
  ['g','kg','ml','l','u'].forEach(u=>{const o=el('option',{value:u},[u]);if(u===S.formInsumo.unidad)o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',e=>S.formInsumo.unidad=e.target.value);
  r.appendChild(si);r.appendChild(sel);cont.appendChild(r);
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:guardarInsumo},[S.editandoInsumo?'Guardar':'Agregar']));
  return makeModal(S.editandoInsumo?'Editar Insumo':'Nuevo Insumo',()=>set({modalInsumo:false}),cont);
}
function renderModalCargaInsumo(){
  const ins=S.insumos.find(i=>i.id===S.modalCargaInsumo);
  const cont=el('div');
  const p=el('p',{style:{color:'#888',marginBottom:'12px'}});
  p.appendChild(document.createTextNode((ins?.nombre||'')+' · Stock actual: '));
  p.appendChild(el('strong',{style:{color:'#f5a623'}},[(ins?.stock||0)+' '+(ins?.unidad||'')]));
  cont.appendChild(p);
  const i=el('input',{type:'number',style:is({marginTop:'4px'}),placeholder:'¿Cuánto agregás?',value:S.cantCarga});
  i.addEventListener('input',e=>S.cantCarga=e.target.value);
  i.addEventListener('keydown',e=>e.key==='Enter'&&cargarStockInsumo());
  cont.appendChild(i);
  cont.appendChild(el('button',{style:{marginTop:'12px',width:'100%',background:'#22c55e',color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:cargarStockInsumo},['Agregar al stock']));
  setTimeout(()=>i.focus(),50);
  return makeModal('Cargar Stock',()=>set({modalCargaInsumo:null}),cont);
}

render();
cargarDatos();
</script>
</body>
