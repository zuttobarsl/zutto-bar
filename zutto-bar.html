// ── FIREBASE OPS ──────────────────────────────────────────────────────────────
async function loadAll(){
  try {
    const [ps,is] = await Promise.all([
      getDoc(doc(db,'config','productos')),
      getDoc(doc(db,'config','insumos'))
    ]);
    const prods   = ps.exists() ? ps.data().lista : D_PRO;
    const insumos = is.exists() ? is.data().lista : D_INS;
    if(!ps.exists()) await setDoc(doc(db,'config','productos'),{lista:D_PRO});
    if(!is.exists()) await setDoc(doc(db,'config','insumos'),{lista:D_INS});

    const ds = await getDoc(doc(db,'jornadaActual','actual'));
    let pedidos=[], tituloDia='', diaCerrado=false, mTitulo=false;
    if(ds.exists()){
      const d = ds.data();
      pedidos    = d.pedidos||[];
      tituloDia  = d.titulo||'';
      diaCerrado = d.abierto===false;
    } else {
      mTitulo = true; // día nuevo → pedir título
    }

    const hs = await getDocs(collection(db,'dias'));
    const historial = hs.docs
      .map(d=>({fecha:d.id,...d.data()}))
      .filter(d=>d.fecha!==hoy())
      .sort((a,b)=>b.fecha.localeCompare(a.fecha));

    Object.assign(ST,{prods,insumos,pedidos,tituloDia,diaCerrado,historial,loading:false,mTitulo});
    draw();
  } catch(e){ showToast('Error Firebase: '+e.message,'err'); ST.loading=false; draw(); }
}

async function saveProd(lista){ await setDoc(doc(db,'config','productos'),{lista}); }
async function saveIns(lista) { await setDoc(doc(db,'config','insumos'),{lista}); }

async function savePedidos(pedidos){
  const ref = doc(db,'jornadaActual','actual');

  await setDoc(ref,{
    pedidos,
    fecha:hoy(),
    titulo:ST.tituloDia || fdia(hoy()),
    abierto:true
  });
}

async function doIniciarJornada(){
  const titulo = ST.inputTitulo.trim() || fdia(hoy());
  await setDoc(doc(db,'dias',hoy()),{pedidos:[],fecha:hoy(),titulo,abierto:true});
  st({tituloDia:titulo,mTitulo:false,inputTitulo:'',pedidos:[],diaCerrado:false});
  showToast('✅ Jornada iniciada: '+titulo);
}

async function doCerrarJornada(){
  const cob = ST.pedidos.filter(p=>p.estado==='cobrado');
  const tot = cob.reduce((s,p)=>s+p.total,0);
  const ef  = cob.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const dig = cob.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  try {
    const ref = doc(db,'dias',hoy());
    const sn  = await getDoc(ref);
    const data= {pedidos:ST.pedidos,fecha:hoy(),titulo:ST.tituloDia||fdia(hoy()),
                 abierto:false,cerradoEn:new Date().toISOString(),
                 resumen:{total:tot,efectivo:ef,digital:dig,cantPedidos:cob.length}};
    if(sn.exists()) await updateDoc(ref,data); else await setDoc(ref,data);
    const hs = await getDocs(collection(db,'dias'));
    const historial = hs.docs.map(d=>({fecha:d.id,...d.data()}))
      .filter(d=>d.fecha!==hoy()).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    st({diaCerrado:true,historial});
    showToast('✅ Jornada cerrada y guardada');
  } catch(e){ showToast('Error: '+e.message,'err'); }
}

async function doEliminarDia(fecha){
  await deleteDoc(doc(db,'dias',fecha));
  st({historial:ST.historial.filter(d=>d.fecha!==fecha),diaDetalle:null});
  showToast('Jornada eliminada','warn');
}

async function opCrearPedido(){
  if(!ST.nuevoNombre.trim()){ showToast('Ingresá nombre o número','warn'); return; }
  const p={id:uid(),tipo:ST.nuevoTipo,nombre:ST.nuevoNombre.trim(),
           items:[],estado:'abierto',hora:hora(),total:0,pago:null};
  const pedidos=[p,...ST.pedidos];
  st({pedidos,mNuevoPedido:false,pedidoActivo:p.id,nuevoNombre:''});
  await savePedidos(pedidos);
}

async function opAgregarItem(pedId,prod){
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId) return p;
    const ex=p.items.find(i=>i.pid===prod.id);
    const items=ex
      ? p.items.map(i=>i.pid===prod.id?{...i,q:i.q+1}:i)
      : [...p.items,{pid:prod.id,nombre:prod.nombre,precio:prod.precio,ico:prod.ico,q:1}];
    return {...p,items,total:items.reduce((s,i)=>s+i.precio*i.q,0)};
  });
  st({pedidos}); await savePedidos(pedidos);
}

async function opQuitarItem(pedId,pid){
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId) return p;
    const items=p.items.map(i=>i.pid===pid?{...i,q:i.q-1}:i).filter(i=>i.q>0);
    return {...p,items,total:items.reduce((s,i)=>s+i.precio*i.q,0)};
  });
  st({pedidos}); await savePedidos(pedidos);
}

async function opCobrar(pedId,pago){
  let ins=[...ST.insumos];
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId) return p;
    p.items.forEach(item=>{
      const prod=ST.prods.find(pr=>pr.id===item.pid);
      if(!prod) return;
      prod.ins.forEach(r=>{
        const idx=ins.findIndex(i=>i.id===r.id);
        if(idx>=0) ins[idx]={...ins[idx],stock:Math.max(0,ins[idx].stock-r.q*item.q)};
      });
    });
    return {...p,estado:'cobrado',pago,horaFin:hora()};
  });
  st({pedidos,insumos:ins,mCobro:null,pedidoActivo:ST.pedidoActivo===pedId?null:ST.pedidoActivo});
  await Promise.all([savePedidos(pedidos),saveIns(ins)]);
  showToast('✅ Cobrado');
}

async function opCancelar(pedId){
  const pedidos=ST.pedidos.map(p=>p.id===pedId?{...p,estado:'cancelado'}:p);
  st({pedidos,pedidoActivo:ST.pedidoActivo===pedId?null:ST.pedidoActivo});
  await savePedidos(pedidos); showToast('Pedido cancelado','warn');
}

async function opEliminarPedido(pedId){
  const pedidos=ST.pedidos.filter(p=>p.id!==pedId);
  st({pedidos,pedidoActivo:ST.pedidoActivo===pedId?null:ST.pedidoActivo});
  await savePedidos(pedidos); showToast('Pedido eliminado','warn');
}

async function opGuardarProd(){
  const f=ST.fProd;
  if(!f.nombre.trim()||!f.precio){ showToast('Completá nombre y precio','warn'); return; }
  let lista;
  if(ST.editProd){
    lista=ST.prods.map(p=>p.id===ST.editProd?{...p,...f,precio:Number(f.precio)}:p);
    showToast('Producto actualizado');
  } else {
    lista=[...ST.prods,{id:uid(),...f,precio:Number(f.precio)}];
    showToast('Producto agregado ✓');
  }
  st({prods:lista,mProd:false}); await saveProd(lista);
}

async function opEliminarProd(id){
  const lista=ST.prods.filter(p=>p.id!==id);
  st({prods:lista}); await saveProd(lista); showToast('Eliminado','warn');
}

// ── INSUMOS OPS ───────────────────────────────────────────────────────────────
async function opGuardarIns(){
  const f=ST.fIns;
  if(!f.nombre.trim()){ showToast('Ingresá un nombre','warn'); return; }
  let lista;
  if(ST.editIns){
    lista=ST.insumos.map(i=>i.id===ST.editIns?{...i,...f,stock:Number(f.stock)}:i);
    showToast('Actualizado');
  } else {
    lista=[...ST.insumos,{id:uid(),...f,stock:Number(f.stock)}];
    showToast('Agregado ✓');
  }
  st({insumos:lista,mIns:false}); await saveIns(lista);
}

async function opCargarStock(){
  const c=Number(ST.cantCarga);
  if(!c||isNaN(c)){ showToast('Cantidad inválida','warn'); return; }
  const lista=ST.insumos.map(i=>i.id===ST.mCargaIns?{...i,stock:i.stock+c}:i);
  st({insumos:lista,mCargaIns:null,cantCarga:''}); await saveIns(lista); showToast('Stock actualizado ✓');
}

async function opEliminarIns(id){
  if(ST.prods.some(p=>p.ins.some(i=>i.id===id))){ showToast('Insumo en uso','err'); return; }
  const lista=ST.insumos.filter(i=>i.id!==id);
  st({insumos:lista}); await saveIns(lista); showToast('Eliminado','warn');
}

// ── DOM BUILDER ───────────────────────────────────────────────────────────────
function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(props)){
    if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on'))          e.addEventListener(k.slice(2).toLowerCase(),v);
    else                                  e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null) continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}

function modal(titulo,onClose,contenido){
  const ov=h('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.78)',zIndex:'500',
    display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}},
    [h('div',{style:{background:'#1c1c27',borderRadius:'16px',padding:'24px',width:'100%',
      maxWidth:'480px',maxHeight:'90vh',overflowY:'auto',border:'1px solid #2e2e3e'}},
      [h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}},[
        h('h3',{style:{margin:'0',fontWeight:'800',color:'#f5a623'}},[titulo]),
        onClose ? h('button',{style:{background:'none',border:'none',color:'#888',fontSize:'22px',cursor:'pointer'},onClick:onClose},['✕']) : h('span'),
      ]),
      contenido]
    )]
  );
  ov.addEventListener('click',e=>{ if(e.target===ov&&onClose) onClose(); });
  return ov;
}

// ── SECCIÓN: PEDIDOS ──────────────────────────────────────────────────────────
function drawPedidos(){
  const div=h('div',{style:{padding:'16px'}});
  const CLBL={comida:'🍗 Comida',bebida:'🍺 Bebida',promo:'🎉 Promos'};

  // Barra top
  const top=h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
  if(!ST.diaCerrado){
    top.appendChild(h('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',
      padding:'10px 18px',fontWeight:'800',fontSize:'14px',cursor:'pointer',flex:'1'},
      onClick:()=>st({mNuevoPedido:true,nuevoNombre:'',nuevoTipo:'mesa'})},['+ Nuevo Pedido']));
  } else {
    top.appendChild(h('div',{style:{flex:'1',background:'#1c1c27',borderRadius:'10px',
      padding:'10px 14px',fontSize:'12px',color:'#888',border:'1px solid #2a2a35'}},
      ['🔒 Jornada cerrada']));
  }
  const filtros=h('div',{style:{display:'flex',gap:'4px',background:'#15151e',borderRadius:'8px',padding:'4px'}});
  ['abiertos','cobrados','cancelado'].forEach(f=>{
    filtros.appendChild(h('button',{
      style:{background:ST.filtroP===f?'#f5a623':'transparent',color:ST.filtroP===f?'#0f0f13':'#888',
        border:'none',borderRadius:'6px',padding:'6px 8px',fontWeight:'700',fontSize:'11px',cursor:'pointer'},
      onClick:()=>st({filtroP:f})
    },[f==='abiertos'?'Abiertos':f==='cobrados'?'Cobrados':'Cancel.']));
  });
  top.appendChild(filtros); div.appendChild(top);

  // Pedido activo expandido
  const ped=ST.pedidos.find(p=>p.id===ST.pedidoActivo&&p.estado==='abierto');
  if(ped && !ST.diaCerrado){
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'14px',padding:'16px',marginBottom:'16px',border:'2px solid #f5a623'}});
    // cabecera
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},[
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},[
        h('span',{style:{fontSize:'16px',fontWeight:'900'}},[ped.nombre]),
        h('span',{style:{background:TC[ped.tipo]+'22',color:TC[ped.tipo],border:`1px solid ${TC[ped.tipo]}55`,
          borderRadius:'6px',padding:'2px 8px',fontSize:'11px',fontWeight:'700'}},[ped.tipo==='mesa'?'🪑 Mesa':'🛵 Delivery']),
      ]),
      h('button',{style:{background:'none',border:'none',color:'#888',fontSize:'20px',cursor:'pointer'},
        onClick:()=>st({pedidoActivo:null})},['✕']),
    ]));
    // items
    if(!ped.items.length){
      card.appendChild(h('p',{style:{color:'#444',textAlign:'center',margin:'12px 0',fontSize:'13px'}},['Seleccioná productos ↓']));
    } else {
      const ilist=h('div',{style:{marginBottom:'12px'}});
      ped.items.forEach(item=>{
        ilist.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'8px 0',borderBottom:'1px solid #2a2a35'}},[
          h('span',{style:{fontSize:'18px'}},[item.ico]),
          h('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[item.nombre]),
          h('div',{style:{display:'flex',alignItems:'center',gap:'6px'}},[
            h('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900'},
              onClick:()=>opQuitarItem(ped.id,item.pid)},['−']),
            h('span',{style:{fontWeight:'800',minWidth:'20px',textAlign:'center'}},[String(item.q)]),
            h('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900'},
              onClick:()=>opAgregarItem(ped.id,ST.prods.find(p=>p.id===item.pid))},['+']),
          ]),
          h('span',{style:{fontWeight:'800',color:'#f5a623',minWidth:'70px',textAlign:'right',fontSize:'13px'}},[money(item.precio*item.q)]),
        ]));
      });
      card.appendChild(ilist);
    }
    // total
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},[
      h('span',{style:{fontWeight:'700',color:'#888',fontSize:'13px'}},['TOTAL']),
      h('span',{style:{fontWeight:'900',fontSize:'24px',color:'#4ade80'}},[money(ped.total)]),
    ]));
    // botones cobrar/cancelar
    const ok=ped.items.length>0;
    card.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},[
      h('button',{style:{flex:'2',background:ok?'#22c55e':'#2a2a35',color:ok?'#fff':'#555',border:'none',
        borderRadius:'10px',padding:'13px 0',fontWeight:'800',fontSize:'14px',cursor:ok?'pointer':'not-allowed'},
        onClick:()=>ok&&st({mCobro:ped.id})},['💳 Cobrar pedido']),
      h('button',{style:{flex:'1',background:'transparent',color:'#ef4444',border:'1px solid #ef444444',
        borderRadius:'10px',padding:'13px 0',fontWeight:'700',fontSize:'13px',cursor:'pointer'},
        onClick:()=>opCancelar(ped.id)},['Cancelar']),
    ]));
    // grid productos
    card.appendChild(h('p',{style:{fontSize:'11px',color:'#555',margin:'0 0 10px',fontWeight:'800',letterSpacing:'1px'}},['AGREGAR AL PEDIDO']));
    ['comida','bebida','promo'].forEach(cat=>{
      const ps=ST.prods.filter(p=>p.cat===cat);
      if(!ps.length) return;
      card.appendChild(h('p',{style:{fontSize:'11px',color:CC[cat],margin:'0 0 7px',fontWeight:'800'}},[CLBL[cat]]));
      const grid=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'7px',marginBottom:'14px'}});
      ps.forEach(prod=>{
        grid.appendChild(h('button',{style:{background:'#0f0f13',border:`1px solid ${CC[cat]}33`,borderRadius:'10px',
          padding:'10px',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px'},
          onClick:()=>opAgregarItem(ped.id,prod)},[
          h('span',{style:{fontSize:'20px'}},[prod.ico]),
          h('div',{},[
            h('div',{style:{fontSize:'12px',fontWeight:'700',color:'#f0ece4',lineHeight:'1.3'}},[prod.nombre]),
            h('div',{style:{fontSize:'12px',color:CC[cat],fontWeight:'800'}},[money(prod.precio)]),
          ]),
        ]));
      });
      card.appendChild(grid);
    });
    div.appendChild(card);
  }

  // Lista de pedidos
  const filtrados=ST.pedidos.filter(p=>
    ST.filtroP==='abiertos'?p.estado==='abierto':
    ST.filtroP==='cobrados'?p.estado==='cobrado':p.estado==='cancelado'
  );
  if(!filtrados.length){
    div.appendChild(h('div',{style:{textAlign:'center',color:'#333',padding:'40px 0',fontSize:'14px'}},['No hay pedidos '+ST.filtroP]));
  } else {
    const lista=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
    filtrados.forEach(p=>{
      const card=h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',
        border:ST.pedidoActivo===p.id?'2px solid #f5a623':'1px solid #2a2a35',opacity:p.estado==='cancelado'?'0.4':'1'}});
      const row=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      const left=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',flex:'1',
        cursor:p.estado==='abierto'&&!ST.diaCerrado?'pointer':'default'},
        onClick:()=>p.estado==='abierto'&&!ST.diaCerrado&&st({pedidoActivo:p.id})});
      left.appendChild(h('span',{style:{fontWeight:'900',fontSize:'14px'}},[p.nombre]));
      left.appendChild(h('span',{},[p.tipo==='delivery'?'🛵':'🪑']));
      if(p.estado==='cobrado') left.appendChild(h('span',{style:{background:'#22c55e22',color:'#22c55e',
        borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700',border:'1px solid #22c55e44'}},['✅ '+p.pago]));
      if(p.estado==='cancelado') left.appendChild(h('span',{style:{background:'#ef444422',color:'#ef4444',
        borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700'}},['cancelado']));
      const right=h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
      right.appendChild(h('span',{style:{fontWeight:'900',color:'#f5a623',fontSize:'15px'}},[money(p.total)]));
      right.appendChild(h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'6px',
        padding:'4px 8px',fontSize:'12px',cursor:'pointer'},
        onClick:e=>{ e.stopPropagation(); st({mConfirm:{msg:'¿Eliminar el pedido de '+p.nombre+'?',cb:()=>opEliminarPedido(p.id)}}); }},['🗑️']));
      row.appendChild(left); row.appendChild(right); card.appendChild(row);
      card.appendChild(h('div',{style:{fontSize:'11px',color:'#444',marginTop:'3px'}},
        [p.items.length+' productos · '+p.hora+(p.horaFin?' → '+p.horaFin:'')]));
      lista.appendChild(card);
    });
    div.appendChild(lista);
  }
  return div;
}

    padding:'10px 18px',fontWeight:'800',fontSize:'14px',cursor:'pointer',width:'100%',marginBottom:'16px'},
    onClick:()=>st({mIns:true,editIns:null,fIns:{nombre:'',stock:'',unidad:'g'}})},['+ Agregar Insumo']));
  const lista=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  ST.insumos.forEach(ins=>{
    const col=ins.stock<=0?'#ef4444':ins.stock<500?'#f59e0b':'#22c55e';
    const usoEn=ST.prods.filter(p=>p.ins.some(i=>i.id===ins.id));
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',border:`1px solid ${col}33`}});
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between'}},[
      h('div',{},[
        h('div',{style:{fontWeight:'800',fontSize:'14px'}},[ins.nombre]),
        h('div',{style:{fontSize:'12px',color:'#666',marginTop:'2px'}},
          ['Usado en: '+(usoEn.length?usoEn.map(p=>p.nombre).join(', '):'ningún producto')]),
      ]),
      h('div',{style:{textAlign:'right'}},[
        h('div',{style:{fontWeight:'900',color:col,fontSize:'16px'}},[ins.stock+' '+ins.unidad]),
        ins.stock<=0?h('div',{style:{fontSize:'10px',color:'#ef4444',fontWeight:'700'}},['⚠️ SIN STOCK']):h('span'),
      ]),
    ]));
    card.appendChild(h('div',{style:{display:'flex',gap:'6px',marginTop:'10px'}},[
      h('button',{style:{flex:'2',background:'#22c55e22',color:'#22c55e',border:'1px solid #22c55e44',
        borderRadius:'8px',padding:'6px 0',fontWeight:'700',fontSize:'12px',cursor:'pointer'},
        onClick:()=>st({mCargaIns:ins.id,cantCarga:''})},['+ Cargar stock']),
      h('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},
        onClick:()=>st({mIns:true,editIns:ins.id,fIns:{nombre:ins.nombre,stock:String(ins.stock),unidad:ins.unidad}})},['✏️']),
      h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},
        onClick:()=>st({mConfirm:{msg:'¿Eliminar "'+ins.nombre+'"?',cb:()=>opEliminarIns(ins.id)}})},['🗑️']),
    ]));
    lista.appendChild(card);
  });
  div.appendChild(lista); return div;
}

// ── SECCIÓN: CAJA ─────────────────────────────────────────────────────────────
function drawCaja(){
  const cob=ST.pedidos.filter(p=>p.estado==='cobrado');
  const tot=cob.reduce((s,p)=>s+p.total,0);
  const ef =cob.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const dig=cob.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  const vp={};
  cob.forEach(p=>p.items.forEach(it=>{
    if(!vp[it.nombre])vp[it.nombre]={q:0,tot:0,ico:it.ico};
    vp[it.nombre].q+=it.q; vp[it.nombre].tot+=it.precio*it.q;
  }));
  const rank=Object.entries(vp).sort(([,a],[,b])=>b.q-a.q);
  const div=h('div',{style:{padding:'16px'}});

  // Jornada
  div.appendChild(h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',
    marginBottom:'12px',border:'1px solid #2a2a35',display:'flex',justifyContent:'space-between',alignItems:'center'}},[
    h('div',{},[
      h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},['JORNADA']),
      h('div',{style:{fontWeight:'900',fontSize:'15px',color:ST.diaCerrado?'#ef4444':'#f5a623'}},[ST.tituloDia||fdia(hoy())]),
    ]),
    !ST.diaCerrado?h('button',{style:{background:'#2a2a35',border:'none',color:'#888',borderRadius:'8px',
      padding:'6px 10px',cursor:'pointer',fontSize:'12px'},
      onClick:()=>st({mTitulo:true,inputTitulo:ST.tituloDia})},['✏️']):h('span'),
  ]));

  // Total
  div.appendChild(h('div',{style:{background:'linear-gradient(135deg,#22c55e22,#22c55e0a)',
    border:'1px solid #22c55e44',borderRadius:'14px',padding:'16px',marginBottom:'10px'}},[
    h('div',{style:{fontSize:'12px',color:'#22c55e',fontWeight:'700',marginBottom:'4px'}},['💰 TOTAL DEL DÍA']),
    h('div',{style:{fontSize:'34px',fontWeight:'900',color:'#22c55e'}},[money(tot)]),
    h('div',{style:{fontSize:'12px',color:'#888',marginTop:'4px'}},[cob.length+' pedidos cobrados']),
  ]));

  // Grid 4 tarjetas
  const grid=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'16px'}});
  [[money(ef),'💵 EFECTIVO','#f5a623',cob.filter(p=>p.pago==='efectivo').length+' pedidos'],
   [money(dig),'📱 DIGITAL','#38bdf8',cob.filter(p=>p.pago==='digital').length+' pedidos'],
   [String(cob.filter(p=>p.tipo==='mesa').length),'🪑 MESAS','#a78bfa',''],
   [String(cob.filter(p=>p.tipo==='delivery').length),'🛵 DELIVERY','#f97316',''],
  ].forEach(([v,l,c,s])=>{
    grid.appendChild(h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'14px'}},[
      h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},[l]),
      h('div',{style:{fontSize:'22px',fontWeight:'900',color:c,marginTop:'4px'}},[v]),
      s?h('div',{style:{fontSize:'11px',color:'#666'}},[s]):h('span'),
    ]));
  });
  div.appendChild(grid);

  // Ranking
  const rk=h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'14px'}});
  rk.appendChild(h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'12px'}},['📊 MÁS VENDIDOS']));
  if(!rank.length) rk.appendChild(h('p',{style:{color:'#444',textAlign:'center',fontSize:'13px'}},['Sin ventas aún']));
  else rank.forEach(([nombre,d],i)=>{
    rk.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',
      borderBottom:i<rank.length-1?'1px solid #2a2a35':'none'}},[
      h('span',{style:{fontSize:'10px',color:'#555',fontWeight:'900',minWidth:'16px'}},['#'+(i+1)]),
      h('span',{style:{fontSize:'18px'}},[d.ico]),
      h('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[nombre]),
      h('span',{style:{fontSize:'12px',color:'#888'}},[d.q+' u.']),
      h('span',{style:{fontWeight:'800',color:'#f5a623',fontSize:'13px'}},[money(d.tot)]),
    ]));
  });
  div.appendChild(rk);

  // Botón cerrar / nueva jornada
  if(!ST.diaCerrado){
    const ab=ST.pedidos.filter(p=>p.estado==='abierto').length;
    div.appendChild(h('button',{
      style:{width:'100%',background:ab>0?'#2a2a35':'#f5a623',color:ab>0?'#555':'#0f0f13',
        border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:ab>0?'not-allowed':'pointer'},
      onClick:()=>ab===0&&st({mConfirm:{msg:'¿Cerrar la jornada "'+(ST.tituloDia||fdia(hoy()))+'"? Se guardará en el historial.',cb:doCerrarJornada}})
    },[ab>0?`⚠️ Hay ${ab} pedido(s) abierto(s)`:'📅 Cerrar jornada y guardar']));
  } else {
    div.appendChild(h('button',{style:{width:'100%',background:'#f5a623',color:'#0f0f13',border:'none',
      borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:'pointer'},
      onClick:()=>st({mTitulo:true,inputTitulo:''})},['🌅 Iniciar nueva jornada']));
  }
  return div;
}

// ── SECCIÓN: HISTORIAL ────────────────────────────────────────────────────────
function drawHistorial(){
  const div=h('div',{style:{padding:'16px'}});
  div.appendChild(h('h3',{style:{marginBottom:'16px',color:'#f5a623',fontWeight:'900'}},['📅 Historial de Jornadas']));
  if(!ST.historial.length){
    div.appendChild(h('div',{style:{textAlign:'center',color:'#444',padding:'40px 0',fontSize:'14px'}},['Todavía no hay jornadas cerradas']));
    return div;
  }
  ST.historial.forEach(dia=>{
    const res=dia.resumen||{};
    const open=ST.diaDetalle===dia.fecha;
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'14px',padding:'16px',marginBottom:'10px',border:'1px solid #2a2a35'}});
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'},
      onClick:()=>st({diaDetalle:open?null:dia.fecha})},[
      h('div',{},[
        h('div',{style:{fontWeight:'900',fontSize:'15px'}},[dia.titulo||fdia(dia.fecha)]),
        h('div',{style:{fontSize:'11px',color:'#666',marginTop:'2px'}},[fdia(dia.fecha)+' · '+(res.cantPedidos||0)+' pedidos']),
      ]),
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},[
        h('div',{style:{textAlign:'right'}},[
          h('div',{style:{fontWeight:'900',color:'#4ade80',fontSize:'18px'}},[money(res.total||0)]),
          h('span',{style:{fontSize:'10px',fontWeight:'700',color:dia.abierto===false?'#22c55e':'#f59e0b'}},
            [dia.abierto===false?'✅ CERRADO':'⚠️ SIN CERRAR']),
        ]),
        h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',
          padding:'6px 10px',cursor:'pointer',fontSize:'13px'},
          onClick:e=>{ e.stopPropagation(); st({mConfirm:{msg:'¿Eliminar "'+(dia.titulo||fdia(dia.fecha))+'"?',cb:()=>doEliminarDia(dia.fecha)}}); }},['🗑️']),
      ]),
    ]));
    if(open){
      const det=h('div',{style:{marginTop:'14px',borderTop:'1px solid #2a2a35',paddingTop:'14px'}});
      const gg=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'12px'}});
      [[money(res.efectivo||0),'💵 Efectivo','#f5a623'],[money(res.digital||0),'📱 Digital','#38bdf8']].forEach(([v,l,c])=>{
        gg.appendChild(h('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'10px'}},[
          h('div',{style:{fontSize:'11px',color:'#888'}},[l]),
          h('div',{style:{fontSize:'18px',fontWeight:'900',color:c}},[v]),
        ]));
      });
      det.appendChild(gg);
      const peds=(dia.pedidos||[]).filter(p=>p.estado==='cobrado');
      if(peds.length){
        det.appendChild(h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700',marginBottom:'8px'}},['PEDIDOS COBRADOS']));
        peds.forEach(p=>{
          det.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',
            borderBottom:'1px solid #1a1a22',fontSize:'13px'}},[
            h('span',{},[p.nombre+' '+(p.tipo==='delivery'?'🛵':'🪑')]),
            h('span',{style:{color:'#f5a623',fontWeight:'800'}},[money(p.total)]),
          ]));
        });
      }
      card.appendChild(det);
    }
    div.appendChild(card);
  });
  return div;
}

// ── ARRANCAR ──────────────────────────────────────────────────────────────────
draw();
loadAll();
</script>
