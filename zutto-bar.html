];

// ── ESTADO GLOBAL ─────────────────────────────────────────────────────────────
let STATE = {
  tab: 'pedidos',
  productos: [],
  insumos: [],
  pedidos: [],         // pedidos del día actual
  historial: [],       // días cerrados
  diaActual: hoy(),
  loading: true,
  toast: null,
  toastTimer: null,
  // modales
  modalNuevoPedido: false,
  pedidoActivo: null,
  modalCobro: null,
  filtroP: 'abiertos',
  // productos
  modalProducto: false,
  editandoProducto: null,
  formProducto: {nombre:'',precio:'',categoria:'comida',emoji:'🍗',insumos:[]},
  filtroProducto: 'todos',
  // insumos
  modalInsumo: false,
  editandoInsumo: null,
  formInsumo: {nombre:'',stock:'',unidad:'g'},
  modalCargaInsumo: null,
  cantCarga: '',
  // nuevo pedido form
  nuevoTipo: 'mesa',
  nuevoNombre: '',
  // historial
  diaSeleccionado: null,
};

function setState(partial) {
  Object.assign(STATE, partial);
  render();
}

// ── FIREBASE OPERACIONES ──────────────────────────────────────────────────────
async function cargarDatos() {
  try {
    // Productos
    const pSnap = await getDoc(doc(db,'config','productos'));
    const iSnap = await getDoc(doc(db,'config','insumos'));
    const productos = pSnap.exists() ? pSnap.data().lista : DEFAULT_PRODUCTOS;
    const insumos = iSnap.exists() ? iSnap.data().lista : DEFAULT_INSUMOS;
    if (!pSnap.exists()) await setDoc(doc(db,'config','productos'),{lista:DEFAULT_PRODUCTOS});
    if (!iSnap.exists()) await setDoc(doc(db,'config','insumos'),{lista:DEFAULT_INSUMOS});

    // Pedidos del día
    const diaRef = doc(db,'dias',hoy());
    const diaSnap = await getDoc(diaRef);
    const pedidos = diaSnap.exists() ? (diaSnap.data().pedidos||[]) : [];

    // Historial (últimos 30 días)
    const histSnap = await getDocs(query(collection(db,'dias'),orderBy('__name__','desc')));
    const historial = histSnap.docs.map(d=>({fecha:d.id,...d.data()})).filter(d=>d.fecha!==hoy());

    STATE = {...STATE, productos, insumos, pedidos, historial, loading:false};
    render();
  } catch(e) {
    showToast('Error conectando con Firebase: '+e.message,'error');
    STATE.loading = false;
    render();
  }
}

async function guardarProductos(lista) {
  await setDoc(doc(db,'config','productos'),{lista});
}
async function guardarInsumos(lista) {
  await setDoc(doc(db,'config','insumos'),{lista});
}
async function guardarPedidosDia(pedidos) {
  const ref = doc(db,'dias',hoy());
  const snap = await getDoc(ref);
  if (snap.exists()) await updateDoc(ref,{pedidos});
  else await setDoc(ref,{pedidos,fecha:hoy(),abierto:true});
}
async function cerrarDia() {
  const cobrados = STATE.pedidos.filter(p=>p.estado==='cobrado');
  const total = cobrados.reduce((s,p)=>s+p.total,0);
  const efectivo = cobrados.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const digital = cobrados.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  await updateDoc(doc(db,'dias',hoy()),{
    abierto:false, cerradoEn:new Date().toISOString(),
    resumen:{total,efectivo,digital,cantPedidos:cobrados.length}
  });
  showToast('✅ Día cerrado y guardado');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg,tipo='ok') {
  if (STATE.toastTimer) clearTimeout(STATE.toastTimer);
  const timer = setTimeout(()=>setState({toast:null,toastTimer:null}),3000);
  setState({toast:{msg,tipo},toastTimer:timer});
}

// ── LÓGICA PEDIDOS ────────────────────────────────────────────────────────────
async function crearPedido() {
  if (!STATE.nuevoNombre.trim()) { showToast('Ingresá nombre o número','warn'); return; }
  const p = {id:genId(),tipo:STATE.nuevoTipo,nombre:STATE.nuevoNombre.trim(),items:[],estado:'abierto',creadoEn:horaActual(),total:0,pago:null};
  const pedidos = [p,...STATE.pedidos];
  setState({pedidos,modalNuevoPedido:false,pedidoActivo:p.id,nuevoNombre:''});
  await guardarPedidosDia(pedidos);
}

async function agregarItem(pedidoId, prod) {
  const pedidos = STATE.pedidos.map(p=>{
    if(p.id!==pedidoId) return p;
    const ex = p.items.find(i=>i.productoId===prod.id);
    const items = ex ? p.items.map(i=>i.productoId===prod.id?{...i,cantidad:i.cantidad+1}:i)
      : [...p.items,{productoId:prod.id,nombre:prod.nombre,precio:prod.precio,emoji:prod.emoji,cantidad:1}];
    return {...p,items,total:items.reduce((s,i)=>s+i.precio*i.cantidad,0)};
  });
  setState({pedidos});
  await guardarPedidosDia(pedidos);
}

async function quitarItem(pedidoId, productoId) {
  const pedidos = STATE.pedidos.map(p=>{
    if(p.id!==pedidoId) return p;
    const items = p.items.map(i=>i.productoId===productoId?{...i,cantidad:i.cantidad-1}:i).filter(i=>i.cantidad>0);
    return {...p,items,total:items.reduce((s,i)=>s+i.precio*i.cantidad,0)};
  });
  setState({pedidos});
  await guardarPedidosDia(pedidos);
}

async function cobrarPedido(pedidoId, metodoPago) {
  let insumosActualizados = [...STATE.insumos];
  const pedidos = STATE.pedidos.map(p=>{
    if(p.id!==pedidoId) return p;
    p.items.forEach(item=>{
      const prod = STATE.productos.find(pr=>pr.id===item.productoId);
      if(!prod) return;
      prod.insumos.forEach(req=>{
        const idx = insumosActualizados.findIndex(i=>i.id===req.insumoId);
        if(idx>=0) insumosActualizados[idx]={...insumosActualizados[idx],stock:Math.max(0,insumosActualizados[idx].stock-req.cantidad*item.cantidad)};
      });
    });
    return {...p,estado:'cobrado',pago:metodoPago,cerradoEn:horaActual()};
  });
  setState({pedidos,insumos:insumosActualizados,modalCobro:null,pedidoActivo:STATE.pedidoActivo===pedidoId?null:STATE.pedidoActivo});
  await guardarPedidosDia(pedidos);
  await guardarInsumos(insumosActualizados);
  showToast('✅ Pedido cobrado');
}

async function cancelarPedido(pedidoId) {
  const pedidos = STATE.pedidos.map(p=>p.id===pedidoId?{...p,estado:'cancelado'}:p);
  setState({pedidos,pedidoActivo:STATE.pedidoActivo===pedidoId?null:STATE.pedidoActivo});
  await guardarPedidosDia(pedidos);
  showToast('Pedido cancelado','warn');
}

// ── LÓGICA PRODUCTOS ──────────────────────────────────────────────────────────
async function guardarProducto() {
  const f = STATE.formProducto;
  if(!f.nombre.trim()||!f.precio){showToast('Completá nombre y precio','warn');return;}
  let lista;
  if(STATE.editandoProducto) {
    lista = STATE.productos.map(p=>p.id===STATE.editandoProducto?{...p,...f,precio:Number(f.precio)}:p);
    showToast('Producto actualizado');
  } else {
    lista = [...STATE.productos,{id:genId(),...f,precio:Number(f.precio)}];
    showToast('Producto agregado ✓');
  }
  setState({productos:lista,modalProducto:false});
  await guardarProductos(lista);
}

async function eliminarProducto(id) {
  const lista = STATE.productos.filter(p=>p.id!==id);
  setState({productos:lista});
  await guardarProductos(lista);
  showToast('Producto eliminado','warn');
}

// ── LÓGICA INSUMOS ────────────────────────────────────────────────────────────
async function guardarInsumo() {
  const f = STATE.formInsumo;
  if(!f.nombre.trim()){showToast('Ingresá un nombre','warn');return;}
  let lista;
  if(STATE.editandoInsumo) {
    lista = STATE.insumos.map(i=>i.id===STATE.editandoInsumo?{...i,...f,stock:Number(f.stock)}:i);
    showToast('Insumo actualizado');
  } else {
    lista = [...STATE.insumos,{id:genId(),...f,stock:Number(f.stock)}];
    showToast('Insumo agregado ✓');
  }
  setState({insumos:lista,modalInsumo:false});
  await guardarInsumos(lista);
}

async function cargarStockInsumo() {
  const cant = Number(STATE.cantCarga);
  if(!cant||isNaN(cant)){showToast('Ingresá una cantidad válida','warn');return;}
  const lista = STATE.insumos.map(i=>i.id===STATE.modalCargaInsumo?{...i,stock:i.stock+cant}:i);
  setState({insumos:lista,modalCargaInsumo:null,cantCarga:''});
  await guardarInsumos(lista);
  showToast('Stock actualizado ✓');
}

async function eliminarInsumo(id) {
  const usado = STATE.productos.some(p=>p.insumos.some(i=>i.insumoId===id));
  if(usado){showToast('Este insumo está en uso','error');return;}
  const lista = STATE.insumos.filter(i=>i.id!==id);
  setState({insumos:lista});
  await guardarInsumos(lista);
  showToast('Insumo eliminado','warn');
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const root = document.getElementById('root');

function el(tag,props={},children=[]) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className') e.className=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{ if(c===null||c===undefined) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function render() {
  const S = STATE;
  root.innerHTML='';

  if(S.loading) {
    root.appendChild(el('div',{style:{padding:'40px',textAlign:'center'}},['Cargando...', el('div',{className:'spinner'})]));
    return;
  }

  // WRAPPER
  const wrap = el('div',{style:{maxWidth:'600px',margin:'0 auto',paddingBottom:'80px'}});

  // HEADER
  const cobradosHoy = S.pedidos.filter(p=>p.estado==='cobrado');
  const totalHoy = cobradosHoy.reduce((s,p)=>s+p.total,0);
  const header = el('header',{style:{background:'#1a1a22',borderBottom:'2px solid #f5a623',padding:'14px 20px',display:'flex',alignItems:'center',gap:'12px',position:'sticky',top:'0',zIndex:'100'}},[
    el('span',{style:{fontSize:'26px'}},['🍺🍗']),
    el('div',{},[
      el('div',{style:{fontSize:'17px',fontWeight:'900',fontFamily:"'Black Han Sans',sans-serif",color:'#f5a623',letterSpacing:'1px'}},['ZUTTO BAR']),
      el('div',{style:{fontSize:'10px',color:'#666',fontWeight:'700',letterSpacing:'2px'}},['GESTIÓN INTERNA']),
    ]),
    el('div',{style:{marginLeft:'auto',background:'#0f0f13',borderRadius:'8px',padding:'6px 14px',border:'1px solid #2a2a35'}},[
      el('div',{style:{fontSize:'10px',color:'#666'}},['HOY']),
      el('div',{style:{fontWeight:'900',color:'#4ade80',fontSize:'15px'}},[fmt(totalHoy)]),
    ]),
  ]);
  root.appendChild(header);
  root.appendChild(wrap);

  // CONTENIDO POR TAB
  if(S.tab==='pedidos') wrap.appendChild(renderPedidos());
  else if(S.tab==='productos') wrap.appendChild(renderProductos());
  else if(S.tab==='insumos') wrap.appendChild(renderInsumos());
  else if(S.tab==='caja') wrap.appendChild(renderCaja());
  else if(S.tab==='historial') wrap.appendChild(renderHistorial());

  // NAV BOTTOM
  const tabs = [
    {id:'pedidos',label:'Pedidos',icon:'🧾'},
    {id:'productos',label:'Productos',icon:'📦'},
    {id:'insumos',label:'Insumos',icon:'🏪'},
    {id:'caja',label:'Caja',icon:'💰'},
    {id:'historial',label:'Historial',icon:'📅'},
  ];
  const nav = el('nav',{style:{position:'fixed',bottom:'0',left:'0',right:'0',background:'#1a1a22',borderTop:'1px solid #2a2a35',display:'flex',zIndex:'100'}},
    tabs.map(t=>el('button',{
      style:{flex:'1',padding:'10px 0',border:'none',background:S.tab===t.id?'#f5a62318':'transparent',color:S.tab===t.id?'#f5a623':'#555',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',borderTop:S.tab===t.id?'2px solid #f5a623':'2px solid transparent'},
      onClick:()=>setState({tab:t.id})
    },[
      el('span',{style:{fontSize:'18px'}},[t.icon]),
      el('span',{style:{fontSize:'9px',fontWeight:'700'}},[t.label]),
    ]))
  );
  root.appendChild(nav);

  // MODALES
  if(S.modalNuevoPedido) root.appendChild(renderModalNuevoPedido());
  if(S.modalCobro) root.appendChild(renderModalCobro());
  if(S.modalProducto) root.appendChild(renderModalProducto());
  if(S.modalInsumo) root.appendChild(renderModalInsumo());
  if(S.modalCargaInsumo) root.appendChild(renderModalCargaInsumo());

  // TOAST
  if(S.toast) {
    const bg = S.toast.tipo==='error'?'#ef4444':S.toast.tipo==='warn'?'#f59e0b':'#22c55e';
    root.appendChild(el('div',{style:{position:'fixed',bottom:'90px',left:'50%',transform:'translateX(-50%)',background:bg,color:'#fff',padding:'12px 24px',borderRadius:'12px',fontWeight:'700',fontSize:'14px',zIndex:'9999',boxShadow:'0 4px 20px rgba(0,0,0,.5)',whiteSpace:'nowrap'}},[S.toast.msg]));
  }
}

// ── RENDER PEDIDOS ────────────────────────────────────────────────────────────

  const tipoColor={mesa:'#38bdf8',delivery:'#f97316'};

  // Botón nuevo + filtros
  const topRow = el('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
  topRow.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'10px 18px',fontWeight:'800',fontSize:'14px',cursor:'pointer',flex:'1'},onClick:()=>setState({modalNuevoPedido:true,nuevoNombre:'',nuevoTipo:'mesa'})},['+ Nuevo Pedido']));

      onClick:()=>setState({filtroP:f})

    phL.appendChild(tipoBadge);
    ph.appendChild(phL);
    ph.appendChild(el('button',{style:{background:'none',border:'none',color:'#888',fontSize:'20px',cursor:'pointer'},onClick:()=>setState({pedidoActivo:null})},['✕']));
    card.appendChild(ph);

    // Items
    if(pedidoEnPantalla.items.length===0) {
      card.appendChild(el('p',{style:{color:'#444',textAlign:'center',margin:'16px 0',fontSize:'13px'}},['Seleccioná productos ↓']));
    } else {
      const itemsDiv = el('div',{style:{marginBottom:'12px'}});
      pedidoEnPantalla.items.forEach(item=>{
        const row = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'8px 0',borderBottom:'1px solid #2a2a35'}});
        row.appendChild(el('span',{style:{fontSize:'18px'}},[item.emoji]));
        row.appendChild(el('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[item.nombre]));
        const ctrl = el('div',{style:{display:'flex',alignItems:'center',gap:'6px'}});
        ctrl.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900',fontSize:'16px'},onClick:()=>quitarItem(pedidoEnPantalla.id,item.productoId)},['−']));
        ctrl.appendChild(el('span',{style:{fontWeight:'800',minWidth:'20px',textAlign:'center'}},[String(item.cantidad)]));
        ctrl.appendChild(el('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',width:'28px',height:'28px',borderRadius:'6px',cursor:'pointer',fontWeight:'900',fontSize:'16px'},onClick:()=>agregarItem(pedidoEnPantalla.id,S.productos.find(p=>p.id===item.productoId))},['+'  ]));
        row.appendChild(ctrl);
        row.appendChild(el('span',{style:{fontWeight:'800',color:'#f5a623',minWidth:'72px',textAlign:'right',fontSize:'13px'}},[fmt(item.precio*item.cantidad)]));
        itemsDiv.appendChild(row);
      });
      card.appendChild(itemsDiv);
    }

    // Total
    const totalRow = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}});
    totalRow.appendChild(el('span',{style:{fontWeight:'700',color:'#888',fontSize:'13px'}},['TOTAL']));
    totalRow.appendChild(el('span',{style:{fontWeight:'900',fontSize:'24px',color:'#4ade80'}},[fmt(pedidoEnPantalla.total)]));
    card.appendChild(totalRow);

    // Botones cobrar/cancelar
    const btnRow = el('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
    const canCobrar = pedidoEnPantalla.items.length>0;
    btnRow.appendChild(el('button',{
      style:{flex:'2',background:canCobrar?'#22c55e':'#2a2a35',color:canCobrar?'#fff':'#555',border:'none',borderRadius:'10px',padding:'13px 0',fontWeight:'800',fontSize:'15px',cursor:canCobrar?'pointer':'not-allowed'},
      onClick:()=>canCobrar&&setState({modalCobro:pedidoEnPantalla.id})
    },['💳 Cobrar pedido']));
    btnRow.appendChild(el('button',{
      style:{flex:'1',background:'transparent',color:'#ef4444',border:'1px solid #ef444444',borderRadius:'10px',padding:'13px 0',fontWeight:'700',fontSize:'13px',cursor:'pointer'},
      onClick:()=>cancelarPedido(pedidoEnPantalla.id)
    },['Cancelar']));
    card.appendChild(btnRow);

    // Grid productos para agregar
    card.appendChild(el('p',{style:{fontSize:'11px',color:'#555',margin:'0 0 10px',fontWeight:'800',letterSpacing:'1px'}},['AGREGAR AL PEDIDO']));
    ['comida','bebida','promo'].forEach(cat=>{
      const prods = S.productos.filter(p=>p.categoria===cat);
      if(!prods.length) return;
      card.appendChild(el('p',{style:{fontSize:'11px',color:catColor[cat],margin:'0 0 7px',fontWeight:'800'}},[catLabel[cat]]));
      const grid = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'7px',marginBottom:'14px'}});
      prods.forEach(prod=>{
        const btn = el('button',{
          style:{background:'#0f0f13',border:`1px solid ${catColor[cat]}33`,borderRadius:'10px',padding:'10px',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',textAlign:'left'},
          onClick:()=>agregarItem(pedidoEnPantalla.id,prod)
        },[
          el('span',{style:{fontSize:'22px'}},[prod.emoji]),
          el('div',{},[
            el('div',{style:{fontSize:'12px',fontWeight:'700',color:'#f0ece4',lineHeight:'1.3'}},[prod.nombre]),
            el('div',{style:{fontSize:'12px',color:catColor[cat],fontWeight:'800',marginTop:'1px'}},[fmt(prod.precio)]),
          ]),
        ]);
        grid.appendChild(btn);
      });
      card.appendChild(grid);
    });

    div.appendChild(card);
  }

  // Lista pedidos
  const filtrados = S.pedidos.filter(p=>S.filtroP==='abiertos'?p.estado==='abierto':S.filtroP==='cobrados'?p.estado==='cobrado':p.estado==='cancelado');
  if(filtrados.length===0) {
    div.appendChild(el('div',{style:{textAlign:'center',color:'#333',padding:'40px 0',fontSize:'14px'}},['No hay pedidos '+S.filtroP]));
  } else {
    const lista = el('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
    filtrados.forEach(p=>{
      const card = el('div',{
        style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',border:S.pedidoActivo===p.id?'2px solid #f5a623':'1px solid #2a2a35',cursor:p.estado==='abierto'?'pointer':'default',opacity:p.estado==='cancelado'?'0.4':'1'},
        onClick:()=>p.estado==='abierto'&&setState({pedidoActivo:p.id})
      });
      const row = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      const left = el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
      left.appendChild(el('span',{style:{fontWeight:'900',fontSize:'14px'}},[p.nombre]));
      left.appendChild(el('span',{style:{fontSize:'14px'}},[p.tipo==='delivery'?'🛵':'🪑']));
      if(p.estado==='cobrado') left.appendChild(el('span',{style:{background:'#22c55e22',color:'#22c55e',borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700',border:'1px solid #22c55e44'}},['✅ '+p.pago]));
      if(p.estado==='cancelado') left.appendChild(el('span',{style:{background:'#ef444422',color:'#ef4444',borderRadius:'5px',padding:'1px 7px',fontSize:'10px',fontWeight:'700'}},['cancelado']));
      row.appendChild(left);
      row.appendChild(el('span',{style:{fontWeight:'900',color:'#f5a623',fontSize:'15px'}},[fmt(p.total)]));
      card.appendChild(row);
      card.appendChild(el('div',{style:{fontSize:'11px',color:'#444',marginTop:'3px'}},[`${p.items.length} productos · ${p.creadoEn}${p.cerradoEn?' → '+p.cerradoEn:''}`]));
      lista.appendChild(card);
    });
    div.appendChild(lista);
  }

  return div;
}

// ── RENDER CAJA ───────────────────────────────────────────────────────────────
function renderCaja() {
  const S = STATE;
  const cobrados = S.pedidos.filter(p=>p.estado==='cobrado');
  const total = cobrados.reduce((s,p)=>s+p.total,0);
  const efectivo = cobrados.filter(p=>p.pago==='efectivo').reduce((s,p)=>s+p.total,0);
  const digital = cobrados.filter(p=>p.pago==='digital').reduce((s,p)=>s+p.total,0);
  const mesas = cobrados.filter(p=>p.tipo==='mesa').length;
  const deliveries = cobrados.filter(p=>p.tipo==='delivery').length;

  const ventasProd={};
  cobrados.forEach(p=>p.items.forEach(it=>{
    if(!ventasProd[it.nombre]) ventasProd[it.nombre]={cantidad:0,total:0,emoji:it.emoji};
    ventasProd[it.nombre].cantidad+=it.cantidad;
    ventasProd[it.nombre].total+=it.precio*it.cantidad;
  }));
  const ranking = Object.entries(ventasProd).sort(([,a],[,b])=>b.cantidad-a.cantidad);

  const div = el('div',{style:{padding:'16px'}});

  // Tarjeta total
  const totalCard = el('div',{style:{background:'linear-gradient(135deg,#22c55e22,#22c55e11)',border:'1px solid #22c55e44',borderRadius:'14px',padding:'16px',marginBottom:'10px'}});
  totalCard.appendChild(el('div',{style:{fontSize:'12px',color:'#22c55e',fontWeight:'700',marginBottom:'4px'}},['💰 TOTAL DEL DÍA']));
  totalCard.appendChild(el('div',{style:{fontSize:'34px',fontWeight:'900',color:'#22c55e'}},[fmt(total)]));
  totalCard.appendChild(el('div',{style:{fontSize:'12px',color:'#888',marginTop:'4px'}},[cobrados.length+' pedidos cobrados']));
  div.appendChild(totalCard);

  // Grid 2 col
  const grid = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'16px'}});
  [[fmt(efectivo),'💵 EFECTIVO','#f5a623',cobrados.filter(p=>p.pago==='efectivo').length+' pedidos'],
   [fmt(digital),'📱 DIGITAL','#38bdf8',cobrados.filter(p=>p.pago==='digital').length+' pedidos'],
   [String(mesas),'🪑 MESAS','#a78bfa',''],
   [String(deliveries),'🛵 DELIVERY','#f97316',''],
  ].forEach(([val,label,color,sub])=>{
    const c = el('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'14px'}});
    c.appendChild(el('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},[label]));
    c.appendChild(el('div',{style:{fontSize:'22px',fontWeight:'900',color,marginTop:'4px'}},[val]));
    if(sub) c.appendChild(el('div',{style:{fontSize:'11px',color:'#666'}},[sub]));
    grid.appendChild(c);
  });
  div.appendChild(grid);

  // Ranking
  const rankCard = el('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'16px'}});
  rankCard.appendChild(el('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'12px'}},['📊 PRODUCTOS MÁS VENDIDOS']));
  if(ranking.length===0) rankCard.appendChild(el('p',{style:{color:'#444',textAlign:'center',fontSize:'13px'}},['Sin ventas aún']));
  else ranking.forEach(([nombre,data],idx)=>{
    const row = el('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:idx<ranking.length-1?'1px solid #2a2a35':'none'}});
    row.appendChild(el('span',{style:{fontSize:'10px',color:'#555',fontWeight:'900',minWidth:'16px'}},['#'+(idx+1)]));
    row.appendChild(el('span',{style:{fontSize:'20px'}},[data.emoji]));
    row.appendChild(el('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[nombre]));
    row.appendChild(el('span',{style:{fontSize:'12px',color:'#888'}},[data.cantidad+' u.']));
    row.appendChild(el('span',{style:{fontWeight:'800',color:'#f5a623',fontSize:'13px'}},[fmt(data.total)]));
    rankCard.appendChild(row);
  });
  div.appendChild(rankCard);

  // Botón cerrar día
  const abiertos = S.pedidos.filter(p=>p.estado==='abierto').length;
  const btnCerrar = el('button',{
    style:{width:'100%',background:abiertos>0?'#2a2a35':'#f5a623',color:abiertos>0?'#666':'#0f0f13',border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:abiertos>0?'not-allowed':'pointer'},
    onClick:()=>{ if(abiertos===0) cerrarDia(); }
  },[abiertos>0?`⚠️ Hay ${abiertos} pedido(s) abierto(s)`:'📅 Cerrar el día y guardar']);
  div.appendChild(btnCerrar);

  return div;
}

// ── RENDER HISTORIAL ──────────────────────────────────────────────────────────
function renderHistorial() {
  const S = STATE;
  const div = el('div',{style:{padding:'16px'}});
  div.appendChild(el('h3',{style:{marginBottom:'16px',color:'#f5a623',fontWeight:'900'}},['📅 Historial de Días']));

  if(S.historial.length===0) {
    div.appendChild(el('div',{style:{textAlign:'center',color:'#444',padding:'40px 0',fontSize:'14px'}},['Todavía no hay días cerrados']));
    return div;
  }

  S.historial.forEach(dia=>{
    const res = dia.resumen||{};
    const card = el('div',{style:{background:'#1c1c27',borderRadius:'14px',padding:'16px',marginBottom:'10px',border:'1px solid #2a2a35',cursor:'pointer'},
      onClick:()=>setState({diaSeleccionado:STATE.diaSeleccionado===dia.fecha?null:dia.fecha})
    });
    const top = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
    top.appendChild(el('div',{},[
      el('div',{style:{fontWeight:'900',fontSize:'16px'}},[fechaLegible(dia.fecha)]),
      el('div',{style:{fontSize:'12px',color:'#666',marginTop:'2px'}},[res.cantPedidos?res.cantPedidos+' pedidos':'Sin datos']),
    ]));
    top.appendChild(el('div',{style:{textAlign:'right'}},[
      el('div',{style:{fontWeight:'900',color:'#4ade80',fontSize:'18px'}},[fmt(res.total||0)]),
      el('span',{style:{fontSize:'10px',color:dia.abierto?'#f59e0b':'#22c55e',fontWeight:'700'}},[dia.abierto?'⚠️ SIN CERRAR':'✅ CERRADO']),
    ]));
    card.appendChild(top);

    if(S.diaSeleccionado===dia.fecha) {
      const detail = el('div',{style:{marginTop:'14px',borderTop:'1px solid #2a2a35',paddingTop:'14px'}});
      const g = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}});
      [[fmt(res.efectivo||0),'💵 Efectivo','#f5a623'],[fmt(res.digital||0),'📱 Digital','#38bdf8']].forEach(([v,l,c])=>{
        const cc = el('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'10px'}});
        cc.appendChild(el('div',{style:{fontSize:'11px',color:'#888'}},[l]));
        cc.appendChild(el('div',{style:{fontSize:'18px',fontWeight:'900',color:c}},[v]));
        g.appendChild(cc);
      });
      detail.appendChild(g);

      // Pedidos del día
      if(dia.pedidos&&dia.pedidos.length>0) {
        detail.appendChild(el('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700',margin:'12px 0 8px'}},['PEDIDOS']));
        dia.pedidos.filter(p=>p.estado==='cobrado').forEach(p=>{
          const pr = el('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1a1a22',fontSize:'13px'}});
          pr.appendChild(el('span',{},[p.nombre+' '+(p.tipo==='delivery'?'🛵':'🪑')]));
          pr.appendChild(el('span',{style:{color:'#f5a623',fontWeight:'800'}},[fmt(p.total)]));
          detail.appendChild(pr);
        });
      }
      card.appendChild(detail);
    }
    div.appendChild(card);
  });
  return div;
}

// ── MODALES ───────────────────────────────────────────────────────────────────
function makeModal(title, onClose, content) {
  const overlay = el('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.75)',zIndex:'500',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'},onClick:e=>{if(e.target===overlay)onClose();}});
  const box = el('div',{style:{background:'#1c1c27',borderRadius:'16px',padding:'24px',width:'100%',maxWidth:'480px',maxHeight:'90vh',overflowY:'auto',border:'1px solid #2e2e3e',boxShadow:'0 8px 40px rgba(0,0,0,.6)'}});
  const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}});
  hdr.appendChild(el('h3',{style:{margin:'0',fontWeight:'800',color:'#f5a623'}},[title]));
  hdr.appendChild(el('button',{style:{background:'none',border:'none',color:'#888',fontSize:'22px',cursor:'pointer'},onClick:onClose},['✕']));
  box.appendChild(hdr);
  box.appendChild(content);
  overlay.appendChild(box);
  return overlay;
}

  cont.appendChild(tipoBtns);
  const inp = el('input',{style:inputStyle(),placeholder:S.nuevoTipo==='mesa'?'N° de mesa o nombre...':'Nombre del cliente...',value:S.nuevoNombre});
  inp.addEventListener('input',e=>STATE.nuevoNombre=e.target.value);
  inp.addEventListener('keydown',e=>e.key==='Enter'&&crearPedido());
  cont.appendChild(inp);
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:crearPedido},['Crear Pedido']));
  setTimeout(()=>inp.focus(),50);
  return makeModal('Nuevo Pedido',()=>setState({modalNuevoPedido:false}),cont);
}

function renderModalCobro() {
  const S = STATE;
  const p = S.pedidos.find(x=>x.id===S.modalCobro);
  const cont = el('div');
  const totalDiv = el('div',{style:{textAlign:'center',marginBottom:'20px'}});
  totalDiv.appendChild(el('div',{style:{fontSize:'14px',color:'#888',marginBottom:'4px'}},[p?.nombre||'']));
  totalDiv.appendChild(el('div',{style:{fontSize:'36px',fontWeight:'900',color:'#4ade80'}},[fmt(p?.total)]));
  cont.appendChild(totalDiv);
  cont.appendChild(el('p',{style:{color:'#888',textAlign:'center',marginBottom:'16px',fontSize:'13px'}},['¿Cómo paga?']));
  const btns = el('div',{style:{display:'flex',gap:'10px'}});
  btns.appendChild(el('button',{style:{flex:'1',background:'#22c55e',color:'#fff',border:'none',borderRadius:'12px',padding:'18px',fontWeight:'900',fontSize:'17px',cursor:'pointer'},onClick:()=>cobrarPedido(S.modalCobro,'efectivo')},['💵 Efectivo']));
  btns.appendChild(el('button',{style:{flex:'1',background:'#38bdf8',color:'#0f0f13',border:'none',borderRadius:'12px',padding:'18px',fontWeight:'900',fontSize:'17px',cursor:'pointer'},onClick:()=>cobrarPedido(S.modalCobro,'digital')},['📱 Digital']));
  cont.appendChild(btns);
  return makeModal('Cobrar Pedido',()=>setState({modalCobro:null}),cont);
}

function renderModalProducto() {
  const S = STATE;
  const catColor={comida:'#f5a623',bebida:'#38bdf8',promo:'#a78bfa'};
  const cont = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});

  // emoji + nombre
  const row1 = el('div',{style:{display:'flex',gap:'8px'}});
  const emojiInp = el('input',{style:{...inputStyle(),width:'56px',fontSize:'22px',textAlign:'center'},value:S.formProducto.emoji});
  emojiInp.addEventListener('input',e=>STATE.formProducto.emoji=e.target.value);
  const nomInp = el('input',{style:inputStyle({flex:'1'}),placeholder:'Nombre del producto',value:S.formProducto.nombre});
  nomInp.addEventListener('input',e=>STATE.formProducto.nombre=e.target.value);
  row1.appendChild(emojiInp); row1.appendChild(nomInp);
  cont.appendChild(row1);

  const precioInp = el('input',{type:'number',style:inputStyle(),placeholder:'Precio de venta ($)',value:S.formProducto.precio});
  precioInp.addEventListener('input',e=>STATE.formProducto.precio=e.target.value);
  cont.appendChild(precioInp);

  // categoría
  const catBtns = el('div',{style:{display:'flex',gap:'6px'}});
  ['comida','bebida','promo'].forEach(c=>{
    catBtns.appendChild(el('button',{
      style:{flex:'1',padding:'8px 0',borderRadius:'8px',border:'none',background:S.formProducto.categoria===c?(catColor[c]||'#f5a623'):'#2a2a35',color:S.formProducto.categoria===c?'#0f0f13':'#888',fontWeight:'700',cursor:'pointer',fontSize:'12px'},
      onClick:()=>{ STATE.formProducto.categoria=c; render(); }
    },[c]));
  });
  cont.appendChild(catBtns);

  // insumos
  cont.appendChild(el('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700'}},['INSUMOS QUE USA']));
  S.formProducto.insumos.forEach((ins,idx)=>{
    const insRow = el('div',{style:{display:'flex',gap:'6px',marginBottom:'6px'}});
    const sel = el('select',{style:{flex:'2',background:'#0f0f13',border:'1px solid #333',borderRadius:'8px',padding:'8px 6px',color:'#f0ece4',fontSize:'12px'}});
    sel.appendChild(el('option',{value:''},['-- Insumo --']));
    S.insumos.forEach(i=>{ const o=el('option',{value:i.id},[i.nombre+' ('+i.unidad+')']); if(i.id===ins.insumoId)o.selected=true; sel.appendChild(o); });
    sel.addEventListener('change',e=>{ STATE.formProducto.insumos[idx].insumoId=e.target.value; });
    const cantInp = el('input',{type:'number',style:{...inputStyle(),flex:'1'},placeholder:'Cant.',value:ins.cantidad||''});
    cantInp.addEventListener('input',e=>STATE.formProducto.insumos[idx].cantidad=Number(e.target.value));
    const rem = el('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'0 10px',cursor:'pointer'},onClick:()=>{ STATE.formProducto.insumos.splice(idx,1); render(); }},['✕']);
    insRow.appendChild(sel); insRow.appendChild(cantInp); insRow.appendChild(rem);
    cont.appendChild(insRow);
  });
  cont.appendChild(el('button',{style:{background:'#2a2a35',border:'1px dashed #444',borderRadius:'8px',color:'#888',padding:'8px 0',width:'100%',cursor:'pointer',fontSize:'12px'},onClick:()=>{ STATE.formProducto.insumos.push({insumoId:'',cantidad:0}); render(); }},['+ Agregar insumo']));
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:guardarProducto},[S.editandoProducto?'Guardar cambios':'Agregar producto']));

  return makeModal(S.editandoProducto?'Editar Producto':'Nuevo Producto',()=>setState({modalProducto:false}),cont);
}

function renderModalInsumo() {
  const S = STATE;
  const cont = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  const nomInp = el('input',{style:inputStyle(),placeholder:'Nombre del insumo',value:S.formInsumo.nombre});
  nomInp.addEventListener('input',e=>STATE.formInsumo.nombre=e.target.value);
  cont.appendChild(nomInp);
  const row = el('div',{style:{display:'flex',gap:'8px'}});
  const stInp = el('input',{type:'number',style:inputStyle({flex:'1'}),placeholder:'Stock inicial',value:S.formInsumo.stock});
  stInp.addEventListener('input',e=>STATE.formInsumo.stock=e.target.value);
  const sel = el('select',{style:{width:'80px',background:'#0f0f13',border:'1px solid #333',borderRadius:'10px',padding:'10px',color:'#f0ece4',fontSize:'14px'}});
  ['g','kg','ml','l','u'].forEach(u=>{ const o=el('option',{value:u},[u]); if(u===S.formInsumo.unidad)o.selected=true; sel.appendChild(o); });
  sel.addEventListener('change',e=>STATE.formInsumo.unidad=e.target.value);
  row.appendChild(stInp); row.appendChild(sel);
  cont.appendChild(row);
  cont.appendChild(el('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:guardarInsumo},[S.editandoInsumo?'Guardar':'Agregar']));
  return makeModal(S.editandoInsumo?'Editar Insumo':'Nuevo Insumo',()=>setState({modalInsumo:false}),cont);
}

function renderModalCargaInsumo() {
  const S = STATE;
  const ins = S.insumos.find(i=>i.id===S.modalCargaInsumo);
  const cont = el('div');
  cont.appendChild(el('p',{style:{color:'#888',marginBottom:'12px'}},[ ins?.nombre+' · Stock actual: ']));
  cont.appendChild(el('span',{style:{color:'#f5a623',fontWeight:'900'}},[ins?.stock+' '+ins?.unidad]));
  const inp = el('input',{type:'number',style:inputStyle({marginTop:'12px'}),placeholder:'¿Cuánto agregás?',value:S.cantCarga});
  inp.addEventListener('input',e=>STATE.cantCarga=e.target.value);
  inp.addEventListener('keydown',e=>e.key==='Enter'&&cargarStockInsumo());
  cont.appendChild(inp);
  cont.appendChild(el('button',{style:{marginTop:'12px',width:'100%',background:'#22c55e',color:'#fff',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},onClick:cargarStockInsumo},['Agregar al stock']));
  setTimeout(()=>inp.focus(),50);
  return makeModal('Cargar Stock',()=>setState({modalCargaInsumo:null}),cont);
}

// ── ARRANCAR ──────────────────────────────────────────────────────────────────
render();
cargarDatos();
</script>
</body>
</html>
