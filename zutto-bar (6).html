async function loadAll(){
  try{
    const[ps,is,js,gs,gc]=await Promise.all([
      getDoc(doc(db,'config','productos')),
      getDoc(doc(db,'config','insumos')),
      getDoc(doc(db,'config','jornadaActiva')),
      getDoc(doc(db,'config','gastos')),
      getDoc(doc(db,'config','gastosCfg')),
    ]);
    const prods  =ps.exists()?ps.data().lista:D_PRO;
    const insumos=(is.exists()?is.data().lista:D_INS).map(i=>({costo:0,...i}));
    const gastos =gs.exists()?gs.data().lista:[];
    const gastosCfg=gc.exists()?{meta:String(gc.data().meta||''),pct:String(gc.data().pct??15),acumulado:Number(gc.data().acumulado||0)}:{meta:'',pct:'15',acumulado:0};
    if(!ps.exists())await setDoc(doc(db,'config','productos'),{lista:D_PRO});
    if(!is.exists())await setDoc(doc(db,'config','insumos'),{lista:D_INS});
    if(!gs.exists())await setDoc(doc(db,'config','gastos'),{lista:[]});
    if(!gc.exists())await setDoc(doc(db,'config','gastosCfg'),{meta:0,pct:15,acumulado:0});

    let jornada=null, pedidos=[];
    if(js.exists()&&js.data().id){
      jornada=js.data();
      const pj=await getDoc(doc(db,'jornadas',jornada.id));
      if(pj.exists()) pedidos=pj.data().pedidos||[];
    }

    // Leer jornadas nuevas
    const hs=await getDocs(collection(db,'jornadas'));
    const jornadasNuevas=hs.docs
      .map(d=>({id:d.id,...d.data()}))
      .filter(d=>(!jornada||d.id!==jornada.id)&&d.abierto===false);

    // Leer dias viejos (colección anterior) y convertirlos al nuevo formato
    let diasViejos=[];
    try{
      const dv=await getDocs(collection(db,'dias'));
      diasViejos=dv.docs.map(d=>{
        const data=d.data();
        return {
          id:'dia_'+d.id,
          titulo:data.titulo||d.id,
          inicio:d.id+'T00:00:00.000Z',
          cierre:data.cerradoEn||null,
          pedidos:data.pedidos||[],
          resumen:data.resumen||{},
          abierto:data.abierto,
          esViejo:true
        };
      }).filter(d=>d.abierto===false);
    }catch(e){}

    const historial=[...jornadasNuevas,...diasViejos]
      .sort((a,b)=>(b.inicio||'').localeCompare(a.inicio||''));

    Object.assign(ST,{prods,insumos,pedidos,jornada,historial,gastos,gastosCfg,loading:false,
      mTitulo:!jornada // si no hay jornada activa, pedir título
    });
    draw();
  }catch(e){showToast('Error Firebase: '+e.message,'err');ST.loading=false;draw();}
}

// ── HELPERS: PAGOS MIXTOS / COSTOS ────────────────────────────────────────────
// Devuelve cuánto de un pedido cobrado se pagó en efectivo (compatible con pedidos viejos sin split)
function montoEf(p){
  if(p.montoEfectivo!=null||p.montoDigital!=null) return p.montoEfectivo||0;
  const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
  return p.pago==='efectivo'?tf:0;
}
function montoDig(p){
  if(p.montoEfectivo!=null||p.montoDigital!=null) return p.montoDigital||0;
  const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
  return p.pago==='digital'?tf:0;
}
// Costo en insumos de un producto (según su receta) usando el costo cargado por unidad de insumo
function costoProducto(prod,insumos){
  if(!prod||!prod.ins)return 0;
  return prod.ins.reduce((s,r)=>{
    const ins=insumos.find(i=>i.id===r.id);
    return s+((ins?.costo||0)*(r.q||0));
  },0);
}
// Costo total en insumos consumidos por un pedido
function costoPedido(p,prods,insumos){
  return (p.items||[]).reduce((s,item)=>{
    const prod=prods.find(pr=>pr.id===item.pid);
    return s+costoProducto(prod,insumos)*item.q;
  },0);
}
// Convierte un gasto general a su equivalente diario
function gastoDiario(g){
  const m=Number(g.monto)||0;
  if(g.periodo==='diario')return m;
  if(g.periodo==='semanal')return m/7;
  return m/30; // mensual
}
// Calcula cuánto conviene reservar esta jornada para la meta de gastos generales,
// en base al % de la venta configurado y a lo que ya falta para llegar a la meta.
function calcularReservaGastos(tot,costoIns,gastosCfg){
  const meta=Number(gastosCfg.meta)||0;
  const pct=Number(gastosCfg.pct)||0;
  const acumulado=Number(gastosCfg.acumulado)||0;
  const restante=Math.max(0,meta-acumulado);
  if(restante<=0)return{reserva:0,restante:0,meta,pct,acumulado,cumplida:meta>0};
  const disponible=Math.max(0,tot-costoIns);
  const reserva=Math.min(restante,disponible,tot*pct/100);
  return{reserva,restante,meta,pct,acumulado,cumplida:false};
}

async function doCerrarJornada(){
  if(!ST.jornada)return;
  const cob=ST.pedidos.filter(p=>p.estado==='cobrado');
  const tot=cob.reduce((s,p)=>s+(p.totalFinal>0||p.descuento>0?p.totalFinal:p.total),0);
  const ef =cob.reduce((s,p)=>s+montoEf(p),0);
  const dig=cob.reduce((s,p)=>s+montoDig(p),0);
  const costoIns=cob.reduce((s,p)=>s+costoPedido(p,ST.prods,ST.insumos),0);
  const{reserva:reservaGastos}=calcularReservaGastos(tot,costoIns,ST.gastosCfg);
  const gananciaNeta=Math.max(0,tot-costoIns-reservaGastos);
  const data={pedidos:ST.pedidos,abierto:false,cierre:ts(),
    resumen:{total:tot,efectivo:ef,digital:dig,cantPedidos:cob.length,costoInsumos:costoIns,reservaGastos,gananciaNeta}};
  await updateDoc(doc(db,'jornadas',ST.jornada.id),data);
  await setDoc(doc(db,'config','jornadaActiva'),{id:null});
  const hs=await getDocs(collection(db,'jornadas'));
  const jornadasN=hs.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.id!==ST.jornada.id&&d.abierto===false);
  let diasV=[];
  try{
    const dv=await getDocs(collection(db,'dias'));
    diasV=dv.docs.map(d=>{const dd=d.data();return{id:'dia_'+d.id,titulo:dd.titulo||d.id,inicio:d.id+'T00:00:00.000Z',cierre:dd.cerradoEn||null,pedidos:dd.pedidos||[],resumen:dd.resumen||{}};}).filter(d=>d.resumen.total!=null);
  }catch(ex){}
  const cerrada={id:ST.jornada.id,...ST.jornada,...data};
  const historial=[cerrada,...jornadasN,...diasV].sort((a,b)=>(b.inicio||'').localeCompare(a.inicio||''));
  const nuevoAcumulado=(Number(ST.gastosCfg.acumulado)||0)+reservaGastos;
  const nuevoCfg={meta:Number(ST.gastosCfg.meta)||0,pct:Number(ST.gastosCfg.pct)||0,acumulado:nuevoAcumulado};
  await saveGastosCfg(nuevoCfg);
  st({jornada:null,pedidos:[],historial,mTitulo:true,inputTitulo:'',gastosCfg:{...ST.gastosCfg,acumulado:nuevoAcumulado}});
  showToast('✅ Jornada cerrada'+(reservaGastos>0?' · reservaste '+money(reservaGastos)+' para gastos':''));
}

  st({pedidos,mNuevoPedido:false,pedidoActivo:p.id,nuevoNombre:''});
  await savePedidos(pedidos);
}

async function opAgregarItem(pedId,prod,variante=null){
  const label=variante?prod.nombre+' ('+variante+')':prod.nombre;
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId)return p;
    const key=prod.id+(variante?'_'+variante:'');
    const ex=p.items.find(i=>i.key===key);
    const items=ex
      ?p.items.map(i=>i.key===key?{...i,q:i.q+1}:i)
      :[...p.items,{key,pid:prod.id,nombre:label,precio:prod.precio,ico:prod.ico,q:1,variante}];
    const total=items.reduce((s,i)=>s+i.precio*i.q,0);
    return{...p,items,total,totalFinal:Math.max(0,total-p.descuento)};
  });
  st({pedidos}); await savePedidos(pedidos);
}

async function opQuitarItem(pedId,key){
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId)return p;
    const items=p.items.map(i=>i.key===key?{...i,q:i.q-1}:i).filter(i=>i.q>0);
    const total=items.reduce((s,i)=>s+i.precio*i.q,0);
    return{...p,items,total,totalFinal:Math.max(0,total-p.descuento)};
  });
  st({pedidos}); await savePedidos(pedidos);
}

async function opAplicarDescuento(pedId,descuento){
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId)return p;
    const d=Math.min(Number(descuento)||0,p.total);
    return{...p,descuento:d,totalFinal:Math.max(0,p.total-d)};
  });
  st({pedidos,mDescuento:null}); await savePedidos(pedidos);
}

async function opCobrar(pedId,pago,montoEfectivo,montoDigital){
  let ins=[...ST.insumos];
  const pedidos=ST.pedidos.map(p=>{
    if(p.id!==pedId)return p;
    p.items.forEach(item=>{
      const prod=ST.prods.find(pr=>pr.id===item.pid);
      if(!prod)return;
      prod.ins.forEach(r=>{
        const idx=ins.findIndex(i=>i.id===r.id);
        if(idx>=0)ins[idx]={...ins[idx],stock:Math.max(0,ins[idx].stock-r.q*item.q)};
      });
    });
    const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
    return{...p,estado:'cobrado',pago,montoEfectivo:montoEfectivo||0,montoDigital:montoDigital||0,horaFin:hora(),total:p.total,totalFinal:tf};
  });
  st({pedidos,insumos:ins,mCobro:null,cobroPago:null,cobroEf:'',cobroDig:'',pedidoActivo:ST.pedidoActivo===pedId?null:ST.pedidoActivo});
  await Promise.all([savePedidos(pedidos),saveIns(ins)]);
  showToast('✅ Cobrado');
}

  const varOpciones=typeof f.varOpciones==='string'
    ?f.varOpciones.split(',').map(s=>s.trim()).filter(Boolean)
    :f.varOpciones;
  const prod={...f,precio:Number(f.precio),varOpciones,varCantidad:Number(f.varCantidad)||1};
  let lista;
  if(ST.editProd){lista=ST.prods.map(p=>p.id===ST.editProd?{...p,...prod}:p);showToast('Actualizado');}
  else{lista=[...ST.prods,{id:uid(),...prod}];showToast('Agregado ✓');}
  st({prods:lista,mProd:false}); await saveProd(lista);
}

// ── DOM BUILDER ───────────────────────────────────────────────────────────────
function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return e;
}
const IS=s=>({width:'100%',background:'#0f0f13',border:'1px solid #333',borderRadius:'10px',padding:'10px 12px',color:'#f0ece4',fontSize:'14px',outline:'none',...s});
const CC={comida:'#f5a623',bebida:'#38bdf8',promo:'#a78bfa'};
const TC={mesa:'#38bdf8',delivery:'#f97316'};

function mWrap(titulo,onClose,contenido){
  const ov=h('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.8)',zIndex:'500',display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}});
  ov.addEventListener('click',e=>e.target===ov&&onClose&&onClose());
  const box=h('div',{style:{background:'#1c1c27',borderRadius:'16px',padding:'24px',width:'100%',maxWidth:'480px',maxHeight:'90vh',overflowY:'auto',border:'1px solid #2e2e3e'}});
  const hdr=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}},[
    h('h3',{style:{margin:'0',fontWeight:'800',color:'#f5a623'}},[titulo]),
    onClose?h('button',{style:{background:'none',border:'none',color:'#888',fontSize:'22px',cursor:'pointer'},onClick:onClose},['✕']):h('span'),
  ]);
  box.appendChild(hdr); box.appendChild(contenido); ov.appendChild(box); return ov;
}

function drawMVariante(){
  const{pedidoId,prod,seleccion}=ST.mVariante;
  const cant=prod.varCantidad||1;
  const opciones=prod.varOpciones||[];
  const c=h('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}});
  c.appendChild(h('p',{style:{color:'#888',fontSize:'13px'}},[prod.varLabel||`Elegí ${cant} opción(es):`]));
  const grid=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}});
  opciones.forEach(op=>{
    const sel=seleccion.includes(op);
    const btn=h('button',{style:{background:sel?'#f5a623':'#2a2a35',color:sel?'#0f0f13':'#f0ece4',border:'none',borderRadius:'10px',padding:'12px',fontWeight:'700',fontSize:'13px',cursor:'pointer'},
      onClick:()=>{
        const s=[...seleccion];
        if(sel){ s.splice(s.indexOf(op),1); }
        else if(s.length<cant){ s.push(op); }
        else{ s.shift(); s.push(op); }
        st({mVariante:{...ST.mVariante,seleccion:s}});
      }},[op]);
    grid.appendChild(btn);
  });
  c.appendChild(grid);
  c.appendChild(h('div',{style:{fontSize:'12px',color:'#888',textAlign:'center'}},[`Seleccionadas: ${seleccion.length}/${cant}`]));
  c.appendChild(h('button',{
    style:{background:seleccion.length===cant?'#22c55e':'#2a2a35',color:seleccion.length===cant?'#fff':'#555',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer',width:'100%'},
    onClick:()=>{
      if(seleccion.length!==cant){showToast(`Elegí ${cant} opción(es)`,'warn');return;}
      const variante=seleccion.join(' + ');
      st({mVariante:null});
      opAgregarItem(pedidoId,prod,variante);
    }},['Agregar al pedido']));
  return mWrap(prod.nombre,()=>st({mVariante:null}),c);
}

  const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
  const c=h('div',{},[

    ]),
    h('p',{style:{color:'#888',textAlign:'center',marginBottom:'16px',fontSize:'13px'}},['¿Cómo paga?']),
  ]);
  const opciones=h('div',{style:{display:'flex',gap:'8px',marginBottom:'14px'}});
  const optDef=[['efectivo','💵 Efectivo','#22c55e'],['digital','📱 Digital','#38bdf8'],['mixto','🔀 Combinado','#a78bfa']];
  optDef.forEach(([id,lbl,col])=>{
    const activo=ST.cobroPago===id;
    opciones.appendChild(h('button',{style:{flex:'1',background:activo?col:'#2a2a35',color:activo?(id==='digital'?'#0f0f13':'#fff'):'#888',border:'none',borderRadius:'10px',padding:'12px 4px',fontWeight:'900',fontSize:'12px',cursor:'pointer'},
      onClick:()=>{
        if(id==='efectivo')return opCobrar(ST.mCobro,'efectivo',tf,0);
        if(id==='digital')return opCobrar(ST.mCobro,'digital',0,tf);
        st({cobroPago:'mixto',cobroEf:String(tf),cobroDig:'0'});
      }},[lbl]));
  });
  c.appendChild(opciones);

  if(ST.cobroPago==='mixto'){
    const box=h('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'14px',border:'1px solid #2a2a35'}});
    box.appendChild(h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'8px'}},['💵 Monto en efectivo']));
    const efInp=h('input',{type:'number',style:IS({marginBottom:'10px'}),placeholder:'0',value:ST.cobroEf});
    const sumaTxt=h('div',{style:{fontSize:'12px',textAlign:'center',marginBottom:'10px'}});
    function refreshSuma(){
      const ef=Number(ST.cobroEf)||0, dig=Number(ST.cobroDig)||0;
      const suma=ef+dig, dif=tf-suma;
      sumaTxt.innerHTML='';
      sumaTxt.appendChild(h('span',{style:{color:Math.abs(dif)<1?'#22c55e':'#ef4444',fontWeight:'800'}},

    box.appendChild(h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'8px'}},['📱 Monto digital / transferencia']));

    digInp.addEventListener('input',e=>{ST.cobroDig=e.target.value;refreshSuma();});
    box.appendChild(digInp);
    box.appendChild(sumaTxt);
    refreshSuma();
    box.appendChild(h('button',{style:{width:'100%',background:'#a78bfa',color:'#fff',border:'none',borderRadius:'10px',padding:'13px',fontWeight:'900',fontSize:'14px',cursor:'pointer'},

        if(Math.round(ef+dig)!==Math.round(tf)){showToast('La suma debe ser igual al total','warn');return;}
        opCobrar(ST.mCobro,'mixto',ef,dig);
      }},['Confirmar cobro combinado']));
    c.appendChild(box);
  }

  return mWrap('Cobrar Pedido',()=>st({mCobro:null,cobroPago:null}),c);
}

  div.appendChild(h('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'10px 18px',fontWeight:'800',fontSize:'14px',cursor:'pointer',width:'100%',marginBottom:'16px'},
    onClick:()=>st({mIns:true,editIns:null,fIns:{nombre:'',stock:'',unidad:'g',costo:''}})},['+ Agregar Insumo']));
  const lista=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  ST.insumos.forEach(ins=>{
    const col=ins.stock<=0?'#ef4444':ins.stock<500?'#f59e0b':'#22c55e';
    const usoEn=ST.prods.filter(p=>p.ins.some(i=>i.id===ins.id));
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',border:`1px solid ${col}33`}});
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between'}},[
      h('div',{},[h('div',{style:{fontWeight:'800',fontSize:'14px'}},[ins.nombre]),h('div',{style:{fontSize:'12px',color:'#666',marginTop:'2px'}},['En: '+(usoEn.length?usoEn.map(p=>p.nombre).join(', '):'ninguno')]),
        h('div',{style:{fontSize:'11px',color:'#f97316',marginTop:'2px',fontWeight:'700'}},['Costo: '+money(ins.costo||0)+' / '+ins.unidad])]),
      h('div',{style:{textAlign:'right'}},[h('div',{style:{fontWeight:'900',color:col,fontSize:'16px'}},[ins.stock+' '+ins.unidad]),ins.stock<=0?h('div',{style:{fontSize:'10px',color:'#ef4444',fontWeight:'700'}},['⚠️ SIN STOCK']):h('span')]),
    ]));
    card.appendChild(h('div',{style:{display:'flex',gap:'6px',marginTop:'10px'}},[
      h('button',{style:{flex:'2',background:'#22c55e22',color:'#22c55e',border:'1px solid #22c55e44',borderRadius:'8px',padding:'6px 0',fontWeight:'700',fontSize:'12px',cursor:'pointer'},onClick:()=>st({mCargaIns:ins.id,cantCarga:''})},['+ Cargar stock']),
      h('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},onClick:()=>st({mIns:true,editIns:ins.id,fIns:{nombre:ins.nombre,stock:String(ins.stock),unidad:ins.unidad,costo:String(ins.costo||0)}})},['✏️']),
      h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},onClick:()=>st({mConfirm:{msg:'¿Eliminar "'+ins.nombre+'"?',cb:()=>opEliminarIns(ins.id)}})},['🗑️']),
    ]));
    lista.appendChild(card);
  });
  div.appendChild(lista);return div;
}

// ── SECCIÓN: GASTOS GENERALES ─────────────────────────────────────────────────
const PERIODO_LBL={diario:'por día',semanal:'por semana',mensual:'por mes'};
function drawGastos(){
  const div=h('div',{style:{padding:'16px'}});
  div.appendChild(h('p',{style:{color:'#888',fontSize:'13px',marginBottom:'14px'}},
    ['Definí una meta de gastos generales (luz, gas, alquiler, sueldos, etc.) y un % de cada venta a destinar. La Caja va a recomendar cuánto reservar cada noche, y cuando juntes la meta, va a dejar de pedirte que reserves.']));

  // ── META Y ACUMULADO ──
  const cfg=ST.gastosCfg;
  const meta=Number(cfg.meta)||0, acumulado=Number(cfg.acumulado)||0;
  const pctProg=meta>0?Math.min(100,(acumulado/meta)*100):0;
  const metaBox=h('div',{style:{background:'linear-gradient(135deg,#a78bfa22,#a78bfa0a)',border:'1px solid #a78bfa44',borderRadius:'14px',padding:'16px',marginBottom:'16px'}});
  metaBox.appendChild(h('div',{style:{fontSize:'12px',color:'#a78bfa',fontWeight:'700',marginBottom:'10px'}},['🎯 META DE GASTOS GENERALES']));

  if(ST.editMeta){
    const r=h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
    const mi=h('input',{type:'number',style:IS(),placeholder:'Meta total ($) — ej: 190000',value:ST.metaInput});
    mi.addEventListener('input',e=>ST.metaInput=e.target.value);
    r.appendChild(mi);
    const pi=h('input',{type:'number',style:IS(),placeholder:'% de cada venta a reservar — ej: 15',value:ST.pctInput});
    pi.addEventListener('input',e=>ST.pctInput=e.target.value);
    r.appendChild(pi);
    r.appendChild(h('div',{style:{display:'flex',gap:'8px'}},[
      h('button',{style:{flex:'1',background:'#2a2a35',color:'#888',border:'none',borderRadius:'10px',padding:'12px',fontWeight:'700',cursor:'pointer'},onClick:()=>st({editMeta:false})},['Cancelar']),
      h('button',{style:{flex:'2',background:'#a78bfa',color:'#fff',border:'none',borderRadius:'10px',padding:'12px',fontWeight:'900',cursor:'pointer'},onClick:opGuardarMeta},['Guardar meta']),
    ]));
    metaBox.appendChild(r);
  }else{
    if(!meta){
      metaBox.appendChild(h('p',{style:{color:'#888',fontSize:'13px',marginBottom:'10px'}},['Todavía no definiste una meta.']));
      metaBox.appendChild(h('div',{style:{display:'flex',gap:'8px'}},[
        h('button',{style:{flex:'1',background:'#2a2a35',color:'#a78bfa',border:'1px solid #a78bfa44',borderRadius:'10px',padding:'10px',fontWeight:'700',fontSize:'12px',cursor:'pointer'},
          onClick:opUsarSumaComoMeta},['Usar suma de gastos cargados']),
        h('button',{style:{flex:'1',background:'#a78bfa',color:'#fff',border:'none',borderRadius:'10px',padding:'10px',fontWeight:'800',fontSize:'12px',cursor:'pointer'},
          onClick:()=>st({editMeta:true,metaInput:cfg.meta||'',pctInput:cfg.pct||'15'})},['+ Definir meta manual']),
      ]));
    }else{
      const barBg=h('div',{style:{background:'#0f0f13',borderRadius:'8px',height:'14px',overflow:'hidden',marginBottom:'8px'}});
      barBg.appendChild(h('div',{style:{width:pctProg+'%',height:'100%',background:pctProg>=100?'#22c55e':'#a78bfa',transition:'width .3s'}}));
      metaBox.appendChild(barBg);
      metaBox.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'10px'}},[
        h('span',{style:{fontWeight:'900',color:'#4ade80'}},[money(acumulado)+' acumulado']),
        h('span',{style:{color:'#888'}},['meta '+money(meta)]),
      ]));
      metaBox.appendChild(h('div',{style:{fontSize:'12px',color:pctProg>=100?'#22c55e':'#888',fontWeight:'700',marginBottom:'12px'}},
        [pctProg>=100?'✅ ¡Meta alcanzada! Ya no hace falta reservar más este período.':'Restan '+money(meta-acumulado)+' · reservando '+cfg.pct+'% de cada venta']));
      metaBox.appendChild(h('div',{style:{display:'flex',gap:'8px'}},[
        h('button',{style:{flex:'1',background:'#2a2a35',color:'#f0ece4',border:'none',borderRadius:'10px',padding:'10px',fontWeight:'700',fontSize:'12px',cursor:'pointer'},
          onClick:()=>st({editMeta:true,metaInput:cfg.meta||'',pctInput:cfg.pct||'15'})},['✏️ Editar meta / %']),
        h('button',{style:{flex:'1',background:'#ef444422',color:'#ef4444',border:'1px solid #ef444444',borderRadius:'10px',padding:'10px',fontWeight:'700',fontSize:'12px',cursor:'pointer'},
          onClick:()=>st({mConfirm:{msg:'¿Reiniciar el acumulado a $0? Usalo cuando arranca un período nuevo.',cb:opReiniciarAcumulado}})},['🔄 Reiniciar período']),
      ]));
    }
  }
  div.appendChild(metaBox);

  // ── LISTA DE GASTOS ITEMIZADOS (referencia para armar la meta) ──
  div.appendChild(h('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'10px 18px',fontWeight:'800',fontSize:'14px',cursor:'pointer',width:'100%',marginBottom:'16px'},
    onClick:()=>st({mGasto:true,editGasto:null,fGasto:{nombre:'',monto:'',periodo:'mensual'}})},['+ Agregar Gasto']));

  if(!ST.gastos.length){div.appendChild(h('div',{style:{textAlign:'center',color:'#444',padding:'30px 0',fontSize:'14px'}},['Todavía no cargaste gastos generales']));return div;}
  div.appendChild(h('p',{style:{fontSize:'11px',color:'#666',fontWeight:'700',marginBottom:'8px'}},['GASTOS CARGADOS']));
  const lista=h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});
  ST.gastos.forEach(g=>{
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',border:'1px solid #2a2a35',display:'flex',justifyContent:'space-between',alignItems:'center'}});
    card.appendChild(h('div',{},[
      h('div',{style:{fontWeight:'800',fontSize:'14px'}},[g.nombre]),
      h('div',{style:{fontSize:'11px',color:'#666',marginTop:'2px'}},[money(g.monto)+' '+(PERIODO_LBL[g.periodo]||'')+'  ·  ≈ '+money(gastoDiario(g))+'/día']),
    ]));
    const right=h('div',{style:{display:'flex',gap:'6px'}});
    right.appendChild(h('button',{style:{background:'#2a2a35',border:'none',color:'#f0ece4',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},
      onClick:()=>st({mGasto:true,editGasto:g.id,fGasto:{nombre:g.nombre,monto:String(g.monto),periodo:g.periodo}})},['✏️']));
    right.appendChild(h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},
      onClick:()=>st({mConfirm:{msg:'¿Eliminar "'+g.nombre+'"?',cb:()=>opEliminarGasto(g.id)}})},['🗑️']));
    card.appendChild(right);
    lista.appendChild(card);
  });
  div.appendChild(lista);return div;
}

// ── MODAL: GASTO ──────────────────────────────────────────────────────────────
function drawMGasto(){
  const f=ST.fGasto;
  const c=h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}});
  const ni=h('input',{style:IS(),placeholder:'Nombre (ej: Electricidad, Gas, Alquiler)',value:f.nombre});
  ni.addEventListener('input',e=>ST.fGasto.nombre=e.target.value);
  c.appendChild(ni);
  const mi=h('input',{type:'number',style:IS(),placeholder:'Monto ($)',value:f.monto});
  mi.addEventListener('input',e=>ST.fGasto.monto=e.target.value);
  c.appendChild(mi);
  c.appendChild(h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},['¿CADA CUÁNTO SE PAGA?']));
  c.appendChild(h('div',{style:{display:'flex',gap:'6px'}},
    ['diario','semanal','mensual'].map(per=>h('button',{style:{flex:'1',padding:'10px 0',borderRadius:'8px',border:'none',cursor:'pointer',fontWeight:'700',fontSize:'12px',
      background:f.periodo===per?'#38bdf8':'#2a2a35',color:f.periodo===per?'#0f0f13':'#888'},
      onClick:()=>{ST.fGasto.periodo=per;draw();}},[PERIODO_LBL[per]]))));
  c.appendChild(h('button',{style:{background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'10px',padding:'14px',fontWeight:'900',fontSize:'15px',cursor:'pointer'},
    onClick:opGuardarGasto},[ST.editGasto?'Guardar cambios':'Agregar gasto']));
  return mWrap(ST.editGasto?'Editar Gasto':'Nuevo Gasto',()=>st({mGasto:false}),c);
}

// ── SECCIÓN: CAJA ─────────────────────────────────────────────────────────────
function drawCaja(){
  const cob=ST.pedidos.filter(p=>p.estado==='cobrado');
  const tot=cob.reduce((s,p)=>s+(p.totalFinal>0||p.descuento>0?p.totalFinal:p.total),0);
  const ef =cob.reduce((s,p)=>s+montoEf(p),0);
  const dig=cob.reduce((s,p)=>s+montoDig(p),0);
  const costoIns=cob.reduce((s,p)=>s+costoPedido(p,ST.prods,ST.insumos),0);
  const{reserva:reservaGastos,restante:restanteMeta,meta:metaGastos,pct:pctGastos,cumplida:metaCumplida}=calcularReservaGastos(tot,costoIns,ST.gastosCfg);
  const gananciaNeta=Math.max(0,tot-costoIns-reservaGastos);
  const vp={};
  cob.forEach(p=>p.items.forEach(it=>{
    if(!vp[it.nombre])vp[it.nombre]={q:0,tot:0,ico:it.ico};
    vp[it.nombre].q+=it.q;vp[it.nombre].tot+=it.precio*it.q;
  }));
  const rank=Object.entries(vp).sort(([,a],[,b])=>b.q-a.q);
  const div=h('div',{style:{padding:'16px'}});

  // Jornada activa
  if(ST.jornada){
    div.appendChild(h('div',{style:{background:'#1c1c27',borderRadius:'12px',padding:'12px 14px',marginBottom:'12px',border:'1px solid #2a2a35',display:'flex',justifyContent:'space-between',alignItems:'center'}},[
      h('div',{},[h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},['JORNADA ACTIVA']),h('div',{style:{fontWeight:'900',fontSize:'15px',color:'#f5a623'}},[ST.jornada.titulo]),h('div',{style:{fontSize:'11px',color:'#666'}},[fts(ST.jornada.inicio)])]),
      h('button',{style:{background:'#2a2a35',border:'none',color:'#888',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'12px'},onClick:()=>st({mTitulo:true,inputTitulo:ST.jornada.titulo})},['✏️']),
    ]));
  }

  div.appendChild(h('div',{style:{background:'linear-gradient(135deg,#22c55e22,#22c55e0a)',border:'1px solid #22c55e44',borderRadius:'14px',padding:'16px',marginBottom:'10px'}},[
    h('div',{style:{fontSize:'12px',color:'#22c55e',fontWeight:'700',marginBottom:'4px'}},['💰 TOTAL JORNADA']),
    h('div',{style:{fontSize:'34px',fontWeight:'900',color:'#22c55e'}},[money(tot)]),
    h('div',{style:{fontSize:'12px',color:'#888',marginTop:'4px'}},[cob.length+' pedidos cobrados']),
  ]));

  const grid=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'16px'}});
  [[money(ef),'💵 EFECTIVO','#f5a623',cob.filter(p=>p.pago==='efectivo').length+' pedidos'],
   [money(dig),'📱 DIGITAL','#38bdf8',cob.filter(p=>p.pago==='digital').length+' pedidos'],
   [String(cob.filter(p=>p.tipo==='mesa').length),'🪑 MESAS','#a78bfa',''],
   [String(cob.filter(p=>p.tipo==='delivery').length),'🛵 DELIVERY','#f97316',''],
  ].forEach(([v,l,c,s])=>{
    grid.appendChild(h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'14px'}},[
      h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700'}},[l]),
      h('div',{style:{fontSize:'22px',fontWeight:'900',color:c,marginTop:'4px'}},[v]),
      s?h('div',{style:{fontSize:'11px',color:'#666'}},[s]):h('span'),
    ]));
  });
  div.appendChild(grid);

  // Recomendación de reserva: insumos + gastos generales + ganancia neta
  if(cob.length){
    const fin=h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'14px'}});
    fin.appendChild(h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'12px'}},['🧮 REPARTO SUGERIDO DE LA CAJA']));
    const filaFin=(lbl,val,col,sub)=>h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid #2a2a35'}},[
      h('div',{},[h('div',{style:{fontSize:'13px',fontWeight:'700'}},[lbl]),sub?h('div',{style:{fontSize:'10px',color:'#666'}},[sub]):h('span')]),
      h('span',{style:{fontWeight:'900',color:col,fontSize:'15px'}},[money(val)]),
    ]);
    fin.appendChild(filaFin('📦 Costo insumos (restock)',costoIns,'#f97316','Para reponer lo vendido esta noche'));
    let subReserva;
    if(!metaGastos)subReserva='Definí una meta en la pestaña Gastos para activar esta recomendación';
    else if(metaCumplida)subReserva='✅ Meta de gastos generales ya cubierta — no hace falta reservar más este período';
    else subReserva=`${pctGastos}% de la venta · restan ${money(restanteMeta)} para llegar a la meta de ${money(metaGastos)}`;
    fin.appendChild(filaFin('🧾 Reserva gastos generales',reservaGastos,'#38bdf8',subReserva));
    const gan=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0 0'}},[
      h('span',{style:{fontSize:'14px',fontWeight:'900'}},['💰 Ganancia neta estimada']),
      h('span',{style:{fontWeight:'900',color:'#4ade80',fontSize:'19px'}},[money(gananciaNeta)]),
    ]);
    fin.appendChild(gan);
    div.appendChild(fin);
  }

  // Resumen de cada pedido cobrado (para revisar antes de cerrar caja)
  if(cob.length){
    const detBox=h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'14px'}});
    detBox.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'},onClick:()=>st({cajaDetalle:!ST.cajaDetalle})},[
      h('span',{style:{fontSize:'12px',color:'#888',fontWeight:'700'}},['🧾 RESUMEN DE PEDIDOS COBRADOS ('+cob.length+')']),
      h('span',{style:{color:'#888',fontSize:'12px',fontWeight:'800'}},[ST.cajaDetalle?'▲ Ocultar':'▼ Ver']),
    ]));
    if(ST.cajaDetalle){
      const lst=h('div',{style:{marginTop:'12px'}});
      cob.forEach((p,i)=>{
        const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
        const e=montoEf(p), dg=montoDig(p);
        const row=h('div',{style:{padding:'8px 0',borderBottom:i<cob.length-1?'1px solid #2a2a35':'none'}});
        row.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},[
          h('div',{},[h('span',{style:{fontWeight:'800',fontSize:'13px'}},[p.nombre+' '+(p.tipo==='delivery'?'🛵':'🪑')]),
            h('span',{style:{fontSize:'11px',color:'#666',marginLeft:'6px'}},[p.items.length+' prod. · '+p.hora])]),
          h('span',{style:{fontWeight:'900',color:'#f5a623',fontSize:'14px'}},[money(tf)]),
        ]));
        const partes=[];
        if(e>0)partes.push('💵 '+money(e));
        if(dg>0)partes.push('📱 '+money(dg));
        row.appendChild(h('div',{style:{fontSize:'11px',color:'#888',marginTop:'2px'}},[partes.join('  +  ')||'—']));
        lst.appendChild(row);
      });
      detBox.appendChild(lst);
    }
    div.appendChild(detBox);
  }

  const rk=h('div',{style:{background:'#1c1c27',border:'1px solid #2a2a35',borderRadius:'14px',padding:'16px',marginBottom:'14px'}});
  rk.appendChild(h('div',{style:{fontSize:'12px',color:'#888',fontWeight:'700',marginBottom:'12px'}},['📊 MÁS VENDIDOS']));
  if(!rank.length)rk.appendChild(h('p',{style:{color:'#444',textAlign:'center',fontSize:'13px'}},['Sin ventas aún']));
  else rank.forEach(([nombre,d],i)=>{
    rk.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:i<rank.length-1?'1px solid #2a2a35':'none'}},[
      h('span',{style:{fontSize:'10px',color:'#555',fontWeight:'900',minWidth:'16px'}},['#'+(i+1)]),
      h('span',{style:{fontSize:'18px'}},[d.ico]),
      h('span',{style:{flex:'1',fontWeight:'700',fontSize:'13px'}},[nombre]),
      h('span',{style:{fontSize:'12px',color:'#888'}},[d.q+' u.']),
      h('span',{style:{fontWeight:'800',color:'#f5a623',fontSize:'13px'}},[money(d.tot)]),
    ]));
  });
  div.appendChild(rk);

  if(ST.jornada){
    const ab=ST.pedidos.filter(p=>p.estado==='abierto').length;
    div.appendChild(h('button',{
      style:{width:'100%',background:ab>0?'#2a2a35':'#ef4444',color:ab>0?'#555':'#fff',border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:ab>0?'not-allowed':'pointer'},
      onClick:()=>ab===0&&st({mConfirm:{msg:'¿Cerrar la jornada "'+ST.jornada.titulo+'"? Se guardará en el historial.',cb:doCerrarJornada}})
    },[ab>0?`⚠️ Hay ${ab} pedido(s) abierto(s)`:'🔒 Cerrar jornada y guardar']));
  }else{
    div.appendChild(h('button',{style:{width:'100%',background:'#f5a623',color:'#0f0f13',border:'none',borderRadius:'12px',padding:'14px',fontWeight:'900',fontSize:'14px',cursor:'pointer'},
      onClick:()=>st({mTitulo:true,inputTitulo:''})},['🌅 Iniciar nueva jornada']));
  }
  return div;
}

// ── SECCIÓN: HISTORIAL ────────────────────────────────────────────────────────
function drawHistorial(){
  const div=h('div',{style:{padding:'16px',minHeight:'200px'}});
  div.appendChild(h('h3',{style:{marginBottom:'16px',color:'#f5a623',fontWeight:'900'}},['📅 Historial de Jornadas']));
  if(!ST.historial||!ST.historial.length){div.appendChild(h('div',{style:{textAlign:'center',color:'#444',padding:'40px 0',fontSize:'14px'}},['Todavía no hay jornadas cerradas']));return div;}
  try{ST.historial.forEach(dia=>{
    if(!dia||!dia.id)return;
    const res=dia.resumen||{};
    const open=ST.diaDetalle===dia.id;
    const card=h('div',{style:{background:'#1c1c27',borderRadius:'14px',padding:'16px',marginBottom:'10px',border:'1px solid #2a2a35'}});
    card.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'},onClick:()=>st({diaDetalle:open?null:dia.id})},[
      h('div',{},[
        h('div',{style:{fontWeight:'900',fontSize:'15px'}},[dia.titulo||'Jornada']),
        h('div',{style:{fontSize:'11px',color:'#666',marginTop:'2px'}},[fts(dia.inicio||'')+(dia.cierre?' → '+fts(dia.cierre):'')]),
        h('div',{style:{fontSize:'11px',color:'#888'}},[(res.cantPedidos||0)+' pedidos']),
      ]),
      h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},[
        h('div',{style:{textAlign:'right'}},[
          h('div',{style:{fontWeight:'900',color:'#4ade80',fontSize:'18px'}},[money(res.total||0)]),
          h('span',{style:{fontSize:'10px',fontWeight:'700',color:'#22c55e'}},['✅ CERRADO']),
        ]),
        h('button',{style:{background:'#2a2a35',border:'none',color:'#ef4444',borderRadius:'8px',padding:'6px 10px',cursor:'pointer',fontSize:'13px'},
          onClick:e=>{e.stopPropagation();st({mConfirm:{msg:'¿Eliminar "'+dia.titulo+'"?',cb:()=>doEliminarJornada(dia.id)}});}},['🗑️']),
      ]),
    ]));
    if(open){
      const det=h('div',{style:{marginTop:'14px',borderTop:'1px solid #2a2a35',paddingTop:'14px'}});
      const gg=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'12px'}});
      [[money(res.efectivo||0),'💵 Efectivo','#f5a623'],[money(res.digital||0),'📱 Digital','#38bdf8']].forEach(([v,l,c])=>{
        gg.appendChild(h('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'10px'}},[h('div',{style:{fontSize:'11px',color:'#888'}},[l]),h('div',{style:{fontSize:'18px',fontWeight:'900',color:c}},[v])]));
      });
      det.appendChild(gg);
      if(res.costoInsumos!=null){
        const gg2=h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'12px'}});
        [[money(res.costoInsumos||0),'📦 Insumos','#f97316'],[money(res.reservaGastos||0),'🧾 Gastos','#a78bfa'],[money(res.gananciaNeta||0),'💰 Neto','#4ade80']].forEach(([v,l,c])=>{
          gg2.appendChild(h('div',{style:{background:'#0f0f13',borderRadius:'10px',padding:'10px'}},[h('div',{style:{fontSize:'10px',color:'#888'}},[l]),h('div',{style:{fontSize:'14px',fontWeight:'900',color:c}},[v])]));
        });
        det.appendChild(gg2);
      }
      const peds=(dia.pedidos||[]).filter(p=>p.estado==='cobrado');
      if(peds.length){
        det.appendChild(h('div',{style:{fontSize:'11px',color:'#888',fontWeight:'700',marginBottom:'8px'}},['PEDIDOS COBRADOS']));
        peds.forEach(p=>{
          const tf=p.totalFinal>0||p.descuento>0?p.totalFinal:p.total;
          const e=montoEf(p), dg=montoDig(p);
          const partes=[]; if(e>0)partes.push('💵 '+money(e)); if(dg>0)partes.push('📱 '+money(dg));
          det.appendChild(h('div',{style:{padding:'6px 0',borderBottom:'1px solid #1a1a22'}},[
            h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px'}},[
              h('div',{},[h('span',{},[p.nombre+' '+(p.tipo==='delivery'?'🛵':'🪑')]),p.descuento>0?h('span',{style:{fontSize:'10px',color:'#f59e0b',marginLeft:'6px'}},['desc. '+money(p.descuento)]):h('span')]),
              h('span',{style:{color:'#f5a623',fontWeight:'800'}},[money(tf)]),
            ]),
            h('div',{style:{fontSize:'10px',color:'#888'}},[partes.join('  +  ')]),
          ]));
        });
      }
      card.appendChild(det);
    }
    div.appendChild(card);
  });}catch(e){div.appendChild(h('div',{style:{color:'#ef4444',padding:'12px',fontSize:'13px'}},['Error cargando historial: '+e.message]));}
  return div;
}

draw();
</script>
